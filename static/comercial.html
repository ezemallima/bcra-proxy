<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vende Seguro — Comercial</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f5ff; --surface: #ffffff; --surface2: #eff6ff; --border: #bfdbfe;
    --text: #0f172a; --text2: #64748b; --text3: #94a3b8;
    --accent: #2563eb; --accent2: #1a56a0;
    --green: #16a34a; --yellow: #ca8a04; --orange: #ea580c; --red: #dc2626;
    --radius: 14px; --tab-h: 64px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

  /* LOGIN */
  #login-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; background: linear-gradient(135deg, #003366 0%, #1a56a0 60%, #2563eb 100%); }
  .login-logo { width: 64px; height: 64px; background: linear-gradient(135deg, #2563eb, #003366); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 24px; box-shadow: 0 8px 32px rgba(200,169,110,0.2); }
  .login-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
  .login-sub { font-size: 13px; color: var(--text2); margin-bottom: 40px; }
  .login-form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; }
  .field-label { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
  .field-input { width: 100%; background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 14px 16px; font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--text); outline: none; transition: border-color 0.2s; }
  .field-input:focus { border-color: var(--accent); }
  .field-input::placeholder { color: var(--text3); }
  .btn-login { width: 100%; background: linear-gradient(135deg, #2563eb, #1a56a0); border: none; border-radius: 10px; padding: 16px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; color: #ffffff; cursor: pointer; margin-top: 8px; transition: opacity 0.2s, transform 0.1s; }
  .btn-login:active { transform: scale(0.98); opacity: 0.9; }
  .login-error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); border-radius: 8px; padding: 12px 14px; font-size: 13px; color: var(--red); text-align: center; display: none; }

  /* APP */
  #app { display: none; flex-direction: column; min-height: 100vh; }
  .app-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 16px 12px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-name { font-size: 15px; font-weight: 600; }
  .header-sub { font-size: 11px; color: var(--accent); font-weight: 500; }
  .btn-logout { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--text2); cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .tab-content { flex: 1; overflow-y: auto; padding-bottom: calc(var(--tab-h) + 16px); }
  .tab-pane { display: none; padding: 16px; }
  .tab-pane.active { display: block; }
  .bottom-tabs { position: fixed; bottom: 0; left: 0; right: 0; height: var(--tab-h); background: var(--surface); border-top: 1px solid var(--border); display: flex; z-index: 100; }
  .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: none; background: none; color: var(--text3); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: color 0.2s; }
  .tab-btn.active { color: var(--accent); }
  .tab-icon { font-size: 22px; line-height: 1; }
  .tab-label { font-size: 10px; font-weight: 500; letter-spacing: 0.3px; }

  /* CONSULTA */
  .search-box { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
  .search-input { flex: 1; background: none; border: none; outline: none; font-family: 'DM Mono', monospace; font-size: 16px; color: var(--text); letter-spacing: 1px; }
  .search-input::placeholder { color: var(--text3); font-family: 'DM Sans', sans-serif; font-size: 14px; letter-spacing: 0; }
  .btn-search { background: var(--accent); border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600; color: #ffffff; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .card-title { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; }
  .score-hero { display: flex; align-items: center; gap: 16px; margin-bottom: 4px; }
  .score-num { font-size: 52px; font-weight: 700; letter-spacing: -2px; line-height: 1; font-family: 'DM Mono', monospace; }
  .score-rango { font-size: 18px; font-weight: 600; }
  .score-bar-wrap { margin-top: 10px; background: var(--bg); border-radius: 4px; height: 6px; overflow: hidden; }
  .score-bar { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
  .sit-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .sit-chip { background: var(--surface2); border-radius: 8px; padding: 8px 12px; font-size: 12px; display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 120px; }
  .sit-chip-label { color: var(--text2); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .sit-chip-val { font-weight: 600; font-size: 14px; }
  .sit-1 { color: var(--green); } .sit-2 { color: var(--yellow); } .sit-3 { color: var(--orange); } .sit-4,.sit-5,.sit-6 { color: var(--red); }
  .credito-box { background: linear-gradient(135deg, #1a1600, #141400); border: 1px solid #3a3000; border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .credito-label { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; margin-bottom: 6px; }
  .credito-monto { font-size: 28px; font-weight: 700; font-family: 'DM Mono', monospace; color: var(--accent2); }
  .credito-nota { font-size: 12px; color: var(--text2); margin-top: 6px; }
  .ia-texto { font-size: 13px; line-height: 1.6; color: var(--text); white-space: pre-wrap; }
  .ia-loading { display: flex; align-items: center; gap: 10px; color: var(--text2); font-size: 13px; }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cheque-item { background: var(--surface2); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
  .cheque-monto { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 600; }
  .cheque-estado { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
  .estado-impago { background: rgba(248,113,113,0.15); color: var(--red); }
  .estado-pagado { background: rgba(74,222,128,0.1); color: var(--green); }
  .divider { height: 1px; background: var(--border); margin: 12px 0; }
  .row-data { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .row-data:last-child { border-bottom: none; }
  .row-key { font-size: 12px; color: var(--text2); }
  .row-val { font-size: 13px; font-weight: 500; text-align: right; }

  /* CARTERA */
  .filter-row { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 4px; }
  .filter-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 12px; font-weight: 500; color: var(--text2); cursor: pointer; white-space: nowrap; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .filter-chip.active { background: var(--accent); color: #ffffff; border-color: var(--accent); }
  .cliente-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; cursor: pointer; transition: border-color 0.15s; }
  .cliente-card:active { border-color: var(--accent); }
  .cliente-card.alerta { border-left: 3px solid var(--red); }
  .cliente-card.excedido-card { border-left: 3px solid var(--orange); }
  .cliente-row1 { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .cliente-nombre { font-size: 14px; font-weight: 600; line-height: 1.3; flex: 1; }
  .score-badge { font-size: 13px; font-weight: 700; font-family: 'DM Mono', monospace; padding: 3px 8px; border-radius: 6px; background: var(--surface2); }
  .cliente-row2 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .cliente-ciudad { font-size: 11px; color: var(--text2); }
  .alerta-badge { font-size: 10px; font-weight: 600; background: rgba(248,113,113,0.15); color: var(--red); border-radius: 4px; padding: 2px 6px; }
  .alerta-temprana-badge { font-size: 10px; font-weight: 600; background: rgba(234,179,8,0.15); color: var(--yellow); border-radius: 4px; padding: 2px 6px; }
  .logistica-medio-badge { font-size: 10px; font-weight: 600; background: rgba(234,179,8,0.12); color: var(--yellow); border-radius: 4px; padding: 2px 6px; }
  .logistica-alto-badge  { font-size: 10px; font-weight: 600; background: rgba(220,38,38,0.12); color: var(--red);    border-radius: 4px; padding: 2px 6px; }
  .sit-badge { font-size: 10px; font-weight: 600; border-radius: 4px; padding: 2px 6px; }
  .saldo-badge { font-size: 10px; font-weight: 600; background: rgba(200,169,110,0.12); color: var(--accent); border-radius: 4px; padding: 2px 6px; }
  .excedido-badge { font-size: 10px; font-weight: 600; background: rgba(220,38,38,0.12); color: var(--red); border-radius: 4px; padding: 2px 6px; }
  .credit-bar-wrap { margin-top: 8px; }
  .credit-bar-track { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; margin-bottom: 4px; }
  .credit-bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
  .credit-bar-label { font-size: 10px; color: var(--text2); }

  /* OPORTUNIDADES */
  .oport-card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--green); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; cursor: pointer; }
  .oport-score { font-size: 22px; font-weight: 700; font-family: 'DM Mono', monospace; color: var(--green); }
  .oport-nombre { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .oport-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .oport-tag { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 4px; background: rgba(74,222,128,0.1); color: var(--green); }

  /* MODAL CLIENTE */
  #detail-modal { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 200; overflow-y: auto; }
  .modal-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
  .btn-back { background: none; border: none; color: var(--accent); font-size: 20px; cursor: pointer; padding: 0; line-height: 1; }
  .modal-title { font-size: 14px; font-weight: 600; flex: 1; line-height: 1.3; }
  .modal-body { padding: 16px; }
  .modal-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .modal-tab { flex: 1; padding: 10px 8px; text-align: center; font-size: 12px; font-weight: 600; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
  .modal-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* FACTURAS */
  .total-box { background: linear-gradient(135deg, #1a1600, #141400); border: 1px solid #3a3000; border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  .total-label { font-size: 12px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .total-monto { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 700; color: var(--accent2); }
  .factura-item { background: var(--surface2); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; border-left: 3px solid var(--border); }
  .factura-item.vencida { border-left-color: var(--red); }
  .factura-item.proxima { border-left-color: var(--yellow); }
  .factura-item.vigente { border-left-color: var(--green); }
  .factura-row1 { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .factura-nro { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text2); }
  .factura-saldo { font-family: 'DM Mono', monospace; font-size: 16px; font-weight: 700; color: var(--accent2); }
  .factura-fechas { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
  .factura-fecha { font-size: 11px; color: var(--text2); }
  .tag-vencida { background: rgba(248,113,113,0.15); color: var(--red); font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 4px; }
  .tag-proxima { background: rgba(251,191,36,0.15); color: var(--yellow); font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 4px; }
  .tag-vigente { background: rgba(74,222,128,0.1); color: var(--green); font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 4px; }

  .empty { text-align: center; padding: 48px 24px; color: var(--text3); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-text { font-size: 14px; line-height: 1.6; }
  .section-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.3px; }
  .section-sub { font-size: 13px; color: var(--text2); margin-bottom: 16px; }
  #loading-overlay { position: fixed; inset: 0; background: rgba(15,15,15,0.85); display: none; align-items: center; justify-content: center; z-index: 999; flex-direction: column; gap: 16px; }
  .loading-text { font-size: 14px; color: var(--text2); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-logo">🍷</div>
  <div class="login-title">Vende Seguro</div>
  <div class="login-sub">vende sin riesgo</div>
  <div class="login-form">
    <div><div class="field-label">Nombre completo</div>
      <input class="field-input" id="inp-nombre" type="text" placeholder="Ej: Alejandro Valan" autocomplete="name"></div>
    <div><div class="field-label">CUIT del comercial</div>
      <input class="field-input" id="inp-cuit" type="tel" placeholder="Ej: 20123456789" inputmode="numeric"></div>
    <div><div class="field-label">PIN de acceso</div>
      <input class="field-input" id="inp-pin" type="password" placeholder="••••••••" autocomplete="off"></div>
    <div class="login-error" id="login-error">Datos incorrectos.</div>
    <button class="btn-login" onclick="doLogin()">Ingresar →</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-header">
    <div>
      <div class="header-name" id="header-name">—</div>
      <div class="header-sub" id="header-cartera">— clientes</div>
    </div>
    <button class="btn-logout" onclick="doLogout()">Salir</button>
  </div>
  <div class="tab-content">
    <div class="tab-pane active" id="tab-consulta">
      <div class="section-title">Consulta CUIT</div>
      <div class="section-sub">Situación BCRA, score y análisis de riesgo</div>
      <div class="search-box">
        <input class="search-input" id="cuit-input" type="tel" inputmode="numeric" placeholder="CUIT sin guiones" maxlength="11">
        <button class="btn-search" onclick="consultarCuit()">Buscar</button>
      </div>
      <div id="consulta-resultado"></div>
    </div>
    <div class="tab-pane" id="tab-cartera">
      <div class="section-title">Mi Cartera</div>
      <div class="section-sub" id="cartera-subtitle">Clientes activos</div>
      <input type="text" class="buscar-input" id="buscar-cartera" placeholder="🔍 Buscar cliente..." oninput="buscarEnCartera(this.value)" translate="no">
      <div class="filter-row">
        <button class="filter-chip active" onclick="filtrarCartera('todos',this)">Todos</button>
        <button class="filter-chip" onclick="filtrarCartera('alertas',this)">⚠ Alertas</button>
        <button class="filter-chip" onclick="filtrarCartera('saldo',this)">💰 Con saldo</button>
        <button id="btn-recalc" onclick="actualizarScores(this)" style="margin-left:auto;background:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;">↻ Scores</button>

      </div>
      <div id="cartera-lista"></div>
    </div>
    <div class="tab-pane" id="tab-oport">
      <div class="section-title">Oportunidades</div>
      <div class="section-sub">Clientes con potencial de venta</div>
      <div style="margin-bottom:12px;">
        <input type="text" id="buscar-oport" placeholder="🔍 Buscar cliente..."
          style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;background:var(--surface);color:var(--text);outline:none;"
          oninput="buscarEnOport(this.value)" translate="no">
      </div>
      <div id="oport-lista"></div>
    </div>
  </div>
  <div class="bottom-tabs">
    <button class="tab-btn active" onclick="switchTab('consulta',this)">
      <span class="tab-icon">🔍</span><span class="tab-label">Consulta</span>
    </button>
    <button class="tab-btn" onclick="switchTab('cartera',this)">
      <span class="tab-icon">📋</span><span class="tab-label">Cartera</span>
    </button>
    <button class="tab-btn" onclick="switchTab('oport',this)">
      <span class="tab-icon">⚡</span><span class="tab-label">Oportunidades</span>
    </button>
  </div>
</div>

<!-- MODAL CLIENTE -->
<div id="detail-modal">
  <div class="modal-header">
    <button class="btn-back" onclick="closeModal()">←</button>
    <div class="modal-title" id="modal-title">Cliente</div>
  </div>
  <div class="modal-body" id="modal-body"></div>
</div>

<!-- Loading -->
<div id="loading-overlay">
  <div class="spinner" style="width:36px;height:36px;border-width:3px"></div>
  <div class="loading-text" id="loading-text">Cargando...</div>
</div>

<script>
const API = 'https://bcra-proxy-xykm.onrender.com';
const PIN_COMERCIAL = 'PIATTELLI2025';

const VENDEDORES = {
  'Adrian Arango':            '20208913604',
  'Alejandro Valan':          '20207619923',
  'Anabel Borrageiros':       '27308869313',
  'Ezequiel Mallima':         '20393831821',
  'Marcelo Fernandez':        '20251483680',
  'Pablo Perticone':          '20224421371',
  'Roberto Pascual':          '20206068834',
  'Sergio Piatanesi':         '20217157332',
  'Valeria Gutierrez Castex': '27224289966',
};

let SESSION = null;
let CARTERA_LOCAL = [];
let ALERTAS = [];
let SALDOS_MAP = {};
let SALDOS_TIMESTAMP = 0;

// ── LOGIN ──
function doLogin() {
  const nombre = document.getElementById('inp-nombre').value.trim();
  const cuit   = document.getElementById('inp-cuit').value.trim().replace(/\D/g,'');
  const pin    = document.getElementById('inp-pin').value.trim();
  const err    = document.getElementById('login-error');
  err.style.display = 'none';
  if (!nombre || !cuit || !pin) { err.textContent = 'Completá todos los campos.'; err.style.display = 'block'; return; }
  if (pin !== PIN_COMERCIAL) { err.textContent = 'PIN incorrecto.'; err.style.display = 'block'; return; }
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const key = Object.keys(VENDEDORES).find(k => norm(k) === norm(nombre));
  if (!key) { err.textContent = 'Nombre no encontrado en el sistema.'; err.style.display = 'block'; return; }
  const cuitEsp = VENDEDORES[key];
  if (!cuitEsp.includes('X') && cuit !== cuitEsp) { err.textContent = 'CUIT no coincide.'; err.style.display = 'block'; return; }
  SESSION = { nombre: key, cuit };
  localStorage.setItem('vendeSeguro_session', JSON.stringify(SESSION));
  iniciarApp();
}

function doLogout() {
  SESSION = null; CARTERA_LOCAL = []; SALDOS_MAP = {}; SALDOS_TIMESTAMP = 0;
  localStorage.removeItem('vendeSeguro_session');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('inp-pin').value = '';
  document.getElementById('consulta-resultado').innerHTML = '';
}

// ── INICIAR ──
async function iniciarApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('header-name').textContent = SESSION.nombre;
  showLoading('Cargando cartera...');

  // BLOQUE 1: Cartera (crítico — si falla, no hay app)
  try {
    const cr = await fetch(API + '/cartera-por-vendedor/' + encodeURIComponent(SESSION.nombre) + '?v=' + Date.now()).catch(() => null);
    if (cr && cr.ok) {
      CARTERA_LOCAL = await cr.json();
      CARTERA_LOCAL.forEach(c => {
        if ((c.total_saldo || 0) > 0) {
          const k = normNombre(c.nombre);
          if (!SALDOS_MAP[k]) SALDOS_MAP[k] = { total_saldo: c.total_saldo, facturas: [] };
        }
      });
    }
    if (!CARTERA_LOCAL.length) console.warn('[init] Cartera vacía — verificá que el vendedor tiene clientes asignados en cartera_comercial.json');
  } catch(e) { console.error('[init] Error cargando cartera:', e); }

  // BLOQUE 2: Alertas y scores (opcional — su ausencia NO rompe la cartera)
  try {
    const ar = await fetch(API + '/alertas?v=' + Date.now()).catch(() => null);
    if (ar && ar.ok) {
      const ad = await ar.json();
      if (!ad.error) {
        ALERTAS = ad.alertas || [];
        // Normalizar CUITs para evitar mismatches por guiones/espacios
        const normCuit = c => String(c||'').replace(/-/g,'').replace(/\s/g,'').trim();
        const scoreMap = {};
        (ad.cartera || []).forEach(c => {
          const nc = normCuit(c.cuit);
          if (nc && (c.scoreCompleto ?? 0) > 0) scoreMap[nc] = c;
        });
        const alertaSet = new Set((ad.alertas||[]).map(a => normCuit(a.cuit)).filter(Boolean));
        CARTERA_LOCAL.forEach((c, i) => {
          const nc = normCuit(c.cuit);
          if (scoreMap[nc]) {
            CARTERA_LOCAL[i].score                = scoreMap[nc].scoreCompleto;
            CARTERA_LOCAL[i].scoreRango           = scoreMap[nc].scoreRango;
            CARTERA_LOCAL[i].scoreColor           = scoreMap[nc].scoreColor;
            CARTERA_LOCAL[i].scoreEmoji           = scoreMap[nc].scoreEmoji;
            CARTERA_LOCAL[i].ultimaSit            = scoreMap[nc].ultimaSit || c.ultimaSit || 1;
            CARTERA_LOCAL[i].alerta_temprana      = scoreMap[nc].alerta_temprana || false;
            CARTERA_LOCAL[i].bloquear_oportunidad = scoreMap[nc].bloquear_oportunidad || false;
            CARTERA_LOCAL[i].alerta_logistica     = scoreMap[nc].alerta_logistica || '';
          }
          // alerta desde alertas_cartera.json como segunda fuente (el servidor ya inyecta c.alerta)
          if (alertaSet.has(nc)) CARTERA_LOCAL[i].alerta = true;
          // recalcular oportunidad con score definitivo (threshold v8.0 = 750)
          const _sc8 = CARTERA_LOCAL[i];
          if ((_sc8.score||0) >= 750 && !(_sc8.total_saldo > 0) && !_sc8.bloquear_oportunidad) {
            CARTERA_LOCAL[i].oportunidad = true;
          }
        });
        console.log('[init] Scores:', CARTERA_LOCAL.filter(c=>c.score).length + '/' + CARTERA_LOCAL.length,
          '| Alertas:', alertaSet.size, '| Oportunidades:', CARTERA_LOCAL.filter(c=>c.oportunidad).length);
      } else {
        console.warn('[init] alertas_cartera.json no disponible — cartera carga igual sin scores');
      }
    }
    // Precargar scores para consultas individuales (keyed by CUIT normalizado)
    const scR = await fetch(API + '/scores-cartera?v=' + Date.now()).catch(() => null);
    if (scR && scR.ok) {
      const scD = await scR.json();
      const _sc = scD.scores || {};
      if (Object.keys(_sc).length > 0) {
        window._scoresCartera = _sc;
        // Pasada final: enriquecer cualquier cliente que aún no tenga score
        const ncFn = c => String(c||'').replace(/-/g,'').replace(/\s/g,'').trim();
        let nuevos = 0;
        CARTERA_LOCAL.forEach((c, i) => {
          if (c.score) return;
          const sc = _sc[ncFn(c.cuit)];
          if (sc && sc.scoreCompleto) {
            CARTERA_LOCAL[i].score                = sc.scoreCompleto;
            CARTERA_LOCAL[i].scoreRango           = sc.scoreRango;
            CARTERA_LOCAL[i].scoreColor           = sc.scoreColor;
            CARTERA_LOCAL[i].scoreEmoji           = sc.scoreEmoji;
            CARTERA_LOCAL[i].ultimaSit            = sc.ultimaSit || 1;
            CARTERA_LOCAL[i].alerta_temprana      = sc.alerta_temprana || false;
            CARTERA_LOCAL[i].bloquear_oportunidad = sc.bloquear_oportunidad || false;
            CARTERA_LOCAL[i].alerta_logistica     = sc.alerta_logistica || '';
            if (sc.scoreCompleto >= 750 && !(c.total_saldo > 0) && !sc.bloquear_oportunidad) CARTERA_LOCAL[i].oportunidad = true;
            nuevos++;
          }
        });
        const conScore = CARTERA_LOCAL.filter(c=>c.score).length;
        console.log('[init] scores-cartera aplicado — total con score:', conScore + '/' + CARTERA_LOCAL.length, '| nuevos en esta pasada:', nuevos);
        if (nuevos > 0) { renderCartera(document.querySelector('.filter-chip.active')?.dataset?.filtro || 'todos'); renderOportunidades(); }
      }
    }
  } catch(e) { console.warn('[init] Alertas no disponibles (archivo puede no existir):', e); }

  hideLoading();
  const n = CARTERA_LOCAL.length;
  document.getElementById('header-cartera').textContent = n + ' cliente' + (n!==1?'s':'');
  document.getElementById('cartera-subtitle').textContent = n + ' clientes activos';
  renderCartera('todos');
  renderOportunidades();
  cargarSaldosCartera();
  // Polling cada 5 minutos: detecta nuevo DSO subido por admin
  setInterval(() => cargarSaldosCartera(), 5 * 60 * 1000);
  // Sync cross-tab: detecta cuando la App Principal sube nuevos saldos
  window.addEventListener('storage', e => {
    if (e.key === 'piat_saldos_ts' || e.key === 'piat_dso_global') {
      console.log('[sync] Nuevo DSO detectado vía localStorage — actualizando saldos...');
      SALDOS_MAP = {};      // limpiar saldos viejos
      SALDOS_TIMESTAMP = 0; // forzar re-fetch
      cargarSaldosCartera(true);
    }
  });

  // Restaurar última pestaña y filtro visitados
  const savedTab = localStorage.getItem('vendeSeguro_tab');
  if (savedTab && savedTab !== 'consulta') {
    const tabBtn = [...document.querySelectorAll('.tab-btn')]
      .find(b => b.getAttribute('onclick') && b.getAttribute('onclick').includes("'" + savedTab + "'"));
    if (tabBtn) switchTab(savedTab, tabBtn);
  }
  const savedFiltro = localStorage.getItem('vendeSeguro_filtro');
  if (savedFiltro && savedFiltro !== 'todos') {
    const chipBtn = [...document.querySelectorAll('.filter-chip')]
      .find(c => c.getAttribute('onclick') && c.getAttribute('onclick').includes("'" + savedFiltro + "'"));
    if (chipBtn) filtrarCartera(savedFiltro, chipBtn);
  }
}

// ── SALDOS ──
function normNombre(s) {
  return String(s||'').trim().toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Z0-9]/g,' ').replace(/\s+/g,' ').trim();
}

async function cargarSaldosCartera(forzar = false) {
  // Verificar si hay actualización — ts=0 = server reiniciado → forzar reload
  try {
    const tsR = await fetch(API + '/saldos-timestamp?v=' + Date.now());
    if (tsR.ok) {
      const tsData = await tsR.json();
      if (!forzar && tsData.ts > 0 && tsData.ts <= SALDOS_TIMESTAMP) return;
      SALDOS_TIMESTAMP = tsData.ts || 0;
    }
  } catch(e) {}

  SALDOS_MAP = {};  // wipe — nunca acumular datos fantasma

  // Un solo fetch por cliente a /api/facturas/<cuit> — O(1) en el backend
  const clientes = CARTERA_LOCAL.filter((c,i,a) =>
    c.cuit && a.findIndex(x => x.cuit === c.cuit) === i
  );
  for (let i = 0; i < clientes.length; i += 20) {
    await Promise.all(clientes.slice(i, i+20).map(async c => {
      try {
        const r = await fetch(API + '/api/facturas/' + encodeURIComponent(c.cuit) +
                              '?nombre=' + encodeURIComponent(c.nombre || ''));
        if (!r.ok) return;
        const d = await r.json();
        if (d.facturas && d.facturas.length) SALDOS_MAP[normNombre(c.nombre)] = d;
      } catch(e) {}
    }));
  }
  const filtroActivo = document.querySelector('.filter-chip.active');
  const filtro = filtroActivo ? (
    filtroActivo.textContent.includes('saldo') ? 'saldo' :
    filtroActivo.textContent.includes('Alertas') ? 'alertas' : 'todos'
  ) : 'todos';
  renderCartera(filtro);
  renderOportunidades();
}

function normUltra(s) {
  if (!s) return '';
  return String(s).toUpperCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/\bS\.?A\.?\b|\bS\.?R\.?L\.?\b|\bS\.?H\.?\b|\bS\.?A\.?S\.?\b|\bS\.?C\.?A\.?\b|\bSRLH?\b/g, ' ')
    .replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
}
// Primeras N palabras — match Odoo sin CUIT, strips S.A./S.R.L./etc. (ej: "ARRAYGADA LAURA" ↔ "ARRAYGADA LAURA CAROLINA")
function normPrim(s, n = 2) {
  return normUltra(s).split(' ').filter(Boolean).slice(0, n).join(' ');
}
function getSaldos(nombre) {
  // Exacto primero, luego por primeras 2 palabras
  return SALDOS_MAP[normNombre(nombre)]
    || Object.entries(SALDOS_MAP).find(([k]) => normPrim(k) === normPrim(nombre))?.[1]
    || null;
}

    if (scR && scR.ok) {
      const _sc = (await scR.json()).scores || {};
      window._scoresCartera = _sc;
      const ncFn = x => String(x||'').replace(/-/g,'').replace(/\s/g,'').trim();
      CARTERA_LOCAL.forEach((c,i) => {
        const sc = _sc[ncFn(c.cuit)];
        if (sc && sc.scoreCompleto) {
          CARTERA_LOCAL[i].score                = sc.scoreCompleto;
          CARTERA_LOCAL[i].scoreRango           = sc.scoreRango;
          CARTERA_LOCAL[i].scoreColor           = sc.scoreColor;
          CARTERA_LOCAL[i].scoreEmoji           = sc.scoreEmoji;
          CARTERA_LOCAL[i].alerta_temprana      = sc.alerta_temprana || false;

async function forzarRecalculo(cuit, btn) {
  const orig = btn.textContent;
  btn.textContent = '⏳ Actualizando…'; btn.disabled = true;
  try {
    const r = await fetch(API + '/calcular-score/' + cuit + '?fresh=1');
    const d = await r.json();
    if (d.ok) {
      btn.textContent = '✓ Listo';
      // Re-consultar con datos frescos (el input ya tiene el CUIT)
      setTimeout(() => consultarCuit(), 400);
    } else {
      btn.textContent = '✗ Error';
      setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 2000);
    }
  } catch(e) {

    setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 2000);
  }
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  btn.classList.add('active');

async function refrescarScores() {
  try {
    const r = await fetch(API + '/alertas');
    if (!r.ok) return;
    const ad = await r.json();
    ALERTAS = ad.alertas || [];
    const normCuit = c => String(c||'').replace(/-/g,'').replace(/\s/g,'').trim();
    const scoreMap = {};
    (ad.cartera || []).forEach(c => {
      const nc = normCuit(c.cuit);
      if (nc && (c.scoreCompleto ?? 0) > 0) scoreMap[nc] = c;
    });
    let actualizados = 0;
    CARTERA_LOCAL.forEach((c, i) => {
      const nc = normCuit(c.cuit);
      if (scoreMap[nc]) {
        CARTERA_LOCAL[i].score      = scoreMap[nc].scoreCompleto;
        CARTERA_LOCAL[i].scoreRango = scoreMap[nc].scoreRango;
        CARTERA_LOCAL[i].scoreColor = scoreMap[nc].scoreColor;
        CARTERA_LOCAL[i].scoreEmoji = scoreMap[nc].scoreEmoji;

}

// ── CARTERA ──
function filtrarCartera(filtro, btn) {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  localStorage.setItem('vendeSeguro_filtro', filtro);
  renderCartera(filtro);
}

function renderCartera(filtro) {
  const alertaCuits = new Set(ALERTAS.map(a => a.cuit));
  let lista = CARTERA_LOCAL;
  if (filtro === 'alertas') lista = lista.filter(c => c.alerta || alertaCuits.has(c.cuit));
  else if (filtro === 'riesgo') lista = lista.filter(c => (c.ultimaSit||1) >= 3);
  else if (filtro === 'buenos') lista = lista.filter(c => (c.score||0) >= 700);
  else if (filtro === 'saldo') lista = lista.filter(c => getSaldos(c.nombre));
  // Aplicar búsqueda si hay texto
  if (_carteraFiltrada) lista = lista.filter(c => matchBusqueda(c.nombre, _carteraFiltrada));

  const el = document.getElementById('cartera-lista');
  if (!lista.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">Sin clientes en este filtro</div></div>';
    return;
  }
  el.innerHTML = lista.map(c => {
    const sit = c.ultimaSit || 1;
    const score = c.score ?? null;
    const tieneAlerta = c.alerta || alertaCuits.has(c.cuit);
    const tieneAlertaTemprana = c.alerta_temprana && !tieneAlerta;
    const alertaLog = c.alerta_logistica || '';
    const esOportunidad = c.oportunidad;
    const saldosData = getSaldos(c.nombre);
    const scoreColor = scoreToColor(score);
    const limiteCredito = c.limite_credito || 0;
    const saldoActual = (saldosData && saldosData.total_saldo) || c.total_saldo || 0;
    const cupoDisponible = limiteCredito > 0 ? Math.max(0, limiteCredito - saldoActual) : 0;
    const excedido = limiteCredito > 0 && saldoActual >= limiteCredito;
    const pctUsado = limiteCredito > 0 ? Math.min(100, (saldoActual / limiteCredito) * 100) : 0;
    const barColor = excedido ? 'var(--red)' : pctUsado > 80 ? 'var(--orange)' : 'var(--green)';
    // Colored dot: green=sit1, yellow=sit2, red=sit3+, gray=sin verificar
    const dotColor = !score ? 'var(--text2)' : sit === 1 ? 'var(--green)' : sit === 2 ? 'var(--yellow)' : 'var(--red)';
    const cardBorderClass = tieneAlerta ? ' alerta' : excedido ? ' excedido-card' : '';
    return `<div class="cliente-card${cardBorderClass}" data-cuit="${esc(c.cuit)}" data-nombre="${esc(c.nombre)}" onclick="abrirModalCliente(this.dataset.cuit, this.dataset.nombre)">
      <div class="cliente-row1">
        <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;">
          <span style="flex-shrink:0;width:10px;height:10px;border-radius:50%;background:${dotColor};display:inline-block;" title="Situación ${sit}"></span>
          <div class="cliente-nombre">${esc(c.nombre)}${esOportunidad ? ' <span style="font-size:13px;" title="Oportunidad de venta">⭐</span>' : ''}</div>
        </div>
        ${score ? `<div class="score-badge" style="color:${scoreColor};flex-shrink:0;">${score}</div>` : '<div class="score-badge" style="color:var(--text2);flex-shrink:0;">—</div>'}
      </div>
      <div class="cliente-row2">
        <span class="cliente-ciudad">${esc(c.ciudad||'')}</span>
        <span class="sit-badge sit-${sit}" style="background:${sitBg(sit)};color:${dotColor}">Sit ${sit}</span>
        ${tieneAlerta ? '<span class="alerta-badge">⚠ Alerta</span>' : ''}
        ${tieneAlertaTemprana ? '<span class="alerta-temprana-badge">⚡ Alerta Temprana</span>' : ''}
        ${alertaLog === 'alto' ? '<span class="logistica-alto-badge">🚚 Logística Alto</span>' : alertaLog === 'medio' ? '<span class="logistica-medio-badge">🚚 Logística</span>' : ''}
        ${excedido ? '<span class="excedido-badge">⛔ Límite Excedido</span>' : ''}
        ${saldoActual > 0 && !excedido ? `<span class="saldo-badge">💰 $${fmtM(saldoActual)}</span>` : ''}
      </div>
      ${limiteCredito > 0 ? `<div class="credit-bar-wrap">
        <div class="credit-bar-track"><div class="credit-bar-fill" style="width:${pctUsado}%;background:${barColor}"></div></div>
        <div class="credit-bar-label">${excedido ? '<span style="color:var(--red);font-weight:600">Crédito agotado — $'+fmtM(saldoActual)+' de $'+fmtM(limiteCredito)+'</span>' : 'Crédito: $'+fmtM(cupoDisponible)+' disp. de $'+fmtM(limiteCredito)}</div>
      </div>` : ''}
    </div>`;
  }).join('');
}

// ── OPORTUNIDADES INTELIGENTES ──
// Calcula días desde última compra por cliente (del historial de ventas del servidor)
async function cargarUltimasCompras() {
  if (window.ULTIMAS_COMPRAS) return; // ya cargado
  window.ULTIMAS_COMPRAS = {};
  try {
    const r = await fetch(API + '/dso-ventas');
    if (!r.ok) return;
    const data = await r.json();
    const ventas = data.ventas || [];
    // Para cada cliente, guardar la fecha más reciente
    ventas.forEach(function(v) {
      if (!v.cliente || !v.fecha) return;
      const cn = normNombre(v.cliente);
      const fecha = new Date(v.fecha);
      if (isNaN(fecha)) return;
      if (!window.ULTIMAS_COMPRAS[cn] || fecha > window.ULTIMAS_COMPRAS[cn]) {
        window.ULTIMAS_COMPRAS[cn] = fecha;
      }
    });
    console.log('[oport] Últimas compras cargadas para', Object.keys(window.ULTIMAS_COMPRAS).length, 'clientes');
  } catch(e) { console.warn('[oport] Error cargando ventas:', e); }
}

function diasDesdeUltimaCompra(nombre) {
  if (!window.ULTIMAS_COMPRAS) return null;
  const cn = normNombre(nombre);
  const fecha = window.ULTIMAS_COMPRAS[cn];
  if (!fecha) return null; // nunca compró (en el historial disponible)
  const hoy = new Date();
  hoy.setHours(0,0,0,0);
  return Math.floor((hoy - fecha) / 86400000);
}

async function renderOportunidades() {
  const el = document.getElementById('oport-lista');
  el.innerHTML = '<div class="empty"><div class="spinner" style="margin:0 auto 12px"></div><div class="empty-text">Analizando oportunidades...</div></div>';

  await cargarUltimasCompras();

  const alertaCuits = new Set(ALERTAS.map(a => a.cuit));
  const hoy = new Date(); hoy.setHours(0,0,0,0);

  // Oportunidad = score >= 750 + (tiene saldo O marcado por servidor) + no excedió límite + no bloqueado
  const candidatos = CARTERA_LOCAL.filter(c => {
    if (c.bloquear_oportunidad) return false;
    const saldoData = getSaldos(c.nombre);
    const tieneSaldo = (saldoData && saldoData.total_saldo > 0) || (c.total_saldo || 0) > 0;
    const limiteCredito = c.limite_credito || 0;
    const saldoActual = (saldoData && saldoData.total_saldo) || c.total_saldo || 0;
    const excedido = limiteCredito > 0 && saldoActual >= limiteCredito;
    return !excedido && ((c.score || 0) >= 750) && (tieneSaldo || c.oportunidad);
  });

  if (!candidatos.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">⚡</div><div class="empty-text">Sin oportunidades detectadas. Los clientes con score ≥ 750 aparecerán aquí.</div></div>';
    return;
  }

  // Enriquecer con días desde última compra
  const opps = candidatos.map(function(c) {
    const dias = diasDesdeUltimaCompra(c.nombre);
    const saldosData = getSaldos(c.nombre);
    const tieneSaldo = saldosData && saldosData.total_saldo > 0;

    // Prioridad de oportunidad:
    // 1. Score alto + sin compra hace 30+ días + sin saldo = contactar ya
    // 2. Score alto + sin compra hace 15+ días = seguimiento
    // 3. Score alto + compra reciente = mantener relación
    let prioridad, motivo, color;
    if (dias === null) {
      prioridad = 2; motivo = 'Sin historial de compras — cliente potencial'; color = 'var(--accent)';
    } else if (dias >= 45) {
      prioridad = 1; motivo = 'Sin compras hace ' + dias + ' días — contactar urgente'; color = 'var(--red)';
    } else if (dias >= 30) {
      prioridad = 1; motivo = 'Sin compras hace ' + dias + ' días — momento de visitar'; color = 'var(--orange)';
    } else if (dias >= 15) {
      prioridad = 2; motivo = 'Última compra hace ' + dias + ' días'; color = 'var(--yellow)';
    } else {
      prioridad = 3; motivo = 'Compra reciente — hace ' + dias + ' días'; color = 'var(--green)';
    }

    return Object.assign({}, c, {dias, prioridad, motivo, color, tieneSaldo});
  })
  // Ordenar: server-flagged oportunidad primero, luego por prioridad/días/score
  .sort(function(a, b) {
    const aOp = a.oportunidad ? 0 : 1;
    const bOp = b.oportunidad ? 0 : 1;
    if (aOp !== bOp) return aOp - bOp;
    if (a.prioridad !== b.prioridad) return a.prioridad - b.prioridad;
    const dA = a.dias === null ? 999 : a.dias;
    const dB = b.dias === null ? 999 : b.dias;
    if (dA !== dB) return dB - dA;
    return (b.score||0) - (a.score||0);
  });

  if (!opps.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">⚡</div><div class="empty-text">Sin oportunidades detectadas.</div></div>';
    return;
  }

  // Aplicar búsqueda si hay texto
  const oppsFiltradas = (_oportFiltrada && _oportFiltrada.length > 0)
    ? opps.filter(c => matchBusqueda(c.nombre, _oportFiltrada))
    : opps;

  if (!oppsFiltradas.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">Sin resultados para "' + _oportFiltrada + '"</div></div>';
    return;
  }

  el.innerHTML = oppsFiltradas.map(function(c) {
    const score = c.score || 0;
    const sit = c.ultimaSit || 1;
    const saldosData = getSaldos(c.nombre);
    const saldoActual = (saldosData && saldosData.total_saldo) || c.total_saldo || 0;
    const limiteCredito = c.limite_credito || 0;
    const cupoDisponible = c.cupo_disponible !== undefined && c.cupo_disponible !== null
      ? c.cupo_disponible
      : (limiteCredito > 0 ? Math.max(0, limiteCredito - saldoActual) : 0);
    const dotColor = sit === 1 ? 'var(--green)' : sit === 2 ? 'var(--yellow)' : 'var(--red)';
    const borderColor = c.oportunidad ? 'var(--accent)' : 'var(--green)';
    const tags = [];
    if (c.oportunidad) tags.push('⭐ Sin saldo — listo para comprar');
    if (score >= 750) tags.push('Score Excelente');
    else tags.push('Score Bueno');
    if (c.dias === null || c.dias >= 30) tags.push('🔥 Contactar');
    if (!c.tieneSaldo) tags.push('Sin deuda pendiente');
    if (c.tieneSaldo) tags.push('Saldo: $' + fmtM(saldoActual));
    if (limiteCredito > 0) tags.push('Cupo: $' + fmtM(cupoDisponible));

    return `<div class="oport-card" style="border-left-color:${borderColor}" data-cuit="${c.cuit}" data-nombre="${esc(c.nombre)}" onclick="abrirModalCliente(this.dataset.cuit, this.dataset.nombre)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="display:flex;align-items:center;gap:7px;flex:1;min-width:0;">
          <span style="flex-shrink:0;width:10px;height:10px;border-radius:50%;background:${dotColor};display:inline-block;" title="Sit ${sit}"></span>
          <div class="oport-nombre">${c.oportunidad ? '⭐ ' : ''}${esc(c.nombre)}</div>
        </div>
        <div class="oport-score" style="color:${scoreToColor(score)}">${score}</div>
      </div>
      <div style="font-size:12px;color:${c.color};font-weight:600;margin-top:4px;">${c.motivo}</div>
      <div style="font-size:11px;color:var(--text2);margin-top:2px">${esc(c.ciudad||'')}</div>
      <div class="oport-tags">${tags.map(t=>`<span class="oport-tag">${t}</span>`).join('')}</div>
    </div>`;
  }).join('');
}

// ── MODAL CLIENTE ──
async function abrirModalCliente(cuit, nombre) {
  document.getElementById('modal-title').textContent = nombre;
  document.getElementById('modal-body').innerHTML = `
    <div class="modal-tabs">
      <div class="modal-tab active" onclick="switchModalTab('facturas',this)">💰 Cuenta corriente</div>
      <div class="modal-tab" onclick="switchModalTab('bcra',this)">🏦 BCRA</div>
    </div>
    <div id="mtab-facturas"><div class="ia-loading"><div class="spinner"></div><span>Cargando...</span></div></div>
    <div id="mtab-bcra" style="display:none"><div class="ia-loading"><div class="spinner"></div><span>Consultando BCRA...</span></div></div>`;
  document.getElementById('detail-modal').style.display = 'flex';
  document.getElementById('detail-modal').style.flexDirection = 'column';

  // Lanzar TODAS las solicitudes en paralelo con safeFetch
  const facP  = safeFetch(API + '/api/facturas/' + encodeURIComponent(cuit) + '?nombre=' + encodeURIComponent(nombre));
  const brP   = safeFetch(API + '/deudas/' + cuit);
  const chrP  = safeFetch(API + '/deudas/' + cuit + '/cheques');
  const hrP   = safeFetch(API + '/deudas/' + cuit + '/historial');
  const scrP  = safeFetch(API + '/fetch-score/' + cuit + '?fresh=1');

  // ── Facturas: renderiza en cuanto llegan (sin esperar BCRA) ──
  facP.then(sd => {
    const factEl = document.getElementById('mtab-facturas');
    if (!factEl) return;
    if (sd?.facturas?.length) SALDOS_MAP[normNombre(nombre)] = sd;
    factEl.innerHTML = sd?.facturas?.length
      ? renderFacturas(sd)
      : '<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">Sin facturas pendientes</div></div>';
  });

  // ── BCRA + Score: esperar las 3 respuestas BCRA + score, luego renderizar ──
  const [bcraData, chData, histData, _scoreData] = await Promise.all([brP, chrP, hrP, scrP]);
  const bcraEl = document.getElementById('mtab-bcra');

  // Detectar error de gateway
  if (bcraData?._gateway_error || chData?._gateway_error) {
    if (bcraEl) bcraEl.innerHTML = _gateway502Html(cuit, nombre);
    return;
  }
  // Actualizar CARTERA_LOCAL con score fresco
  const clienteLocal = CARTERA_LOCAL.find(c => c.cuit === cuit);
  if (_scoreData?.score != null && clienteLocal) {
    clienteLocal.score                = _scoreData.score;
    clienteLocal.scoreRango           = _scoreData.rango;
    clienteLocal.scoreColor           = _scoreData.color;
    clienteLocal.alerta_temprana      = _scoreData.alerta_temprana;
    clienteLocal.bloquear_oportunidad = _scoreData.bloquear_oportunidad;
  }
  console.log("[modal] Score server:", _scoreData?.score,
              "| mora_tecnica:", _scoreData?.mora_tecnica,
              "| cache anterior:", clienteLocal?.score,
              "| scoreData:", _scoreData);
  // Pasar el objeto completo — renderBcraModal usará _scoreData.score, no el caché de CARTERA_LOCAL
  if (bcraEl) bcraEl.innerHTML = renderBcraModal(bcraData, chData, histData, _scoreData, clienteLocal);
}

function switchModalTab(tab, btn) {
  document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('mtab-facturas').style.display = tab==='facturas' ? 'block' : 'none';
  document.getElementById('mtab-bcra').style.display = tab==='bcra' ? 'block' : 'none';
}

function renderFacturas(data) {
  const facturas = data.facturas || [];
  if (!facturas.length) return '<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">Sin facturas pendientes</div></div>';

  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const sorted = [...facturas].sort((a,b) => parseFecha(a.fechaPago)-parseFecha(b.fechaPago));

  let html = `<div class="total-box">
    <div class="total-label">Saldo total pendiente</div>
    <div class="total-monto">$${fmtFull(data.total_saldo)}</div>
  </div>`;

  sorted.forEach(f => {
    const venc = parseFecha(f.fechaPago);
    const dias = Math.round((venc - hoy) / 86400000);
    let clase = 'vigente', tag = `<span class="tag-vigente">Vigente</span>`;
    if (dias < 0) { clase = 'vencida'; tag = `<span class="tag-vencida">Vencida hace ${Math.abs(dias)}d</span>`; }
    else if (dias <= 7) { clase = 'proxima'; tag = `<span class="tag-proxima">Vence en ${dias}d</span>`; }

    const diferencia = f.totalFactura !== f.saldo;
    html += `<div class="factura-item ${clase}">
      <div class="factura-row1">
        <div>
          <div class="factura-nro">${esc(f.nroFactura)}</div>
          ${tag}
        </div>
        <div class="factura-saldo">$${fmtFull(f.saldo)}</div>
      </div>
      <div class="factura-fechas">
        <span class="factura-fecha">📅 Emitida: ${f.fechaFactura}</span>
        <span class="factura-fecha">⏰ Vence: ${f.fechaPago}</span>
      </div>
      ${diferencia ? `<div style="font-size:11px;color:var(--text3);margin-top:4px">Total fac: $${fmtFull(f.totalFactura)}</div>` : ''}
    </div>`;
  });
  return html;
}

function renderBcraModal(bcraData, chData, histData, scoreData, clienteLocal) {
  if (!bcraData || bcraData.error_bcra) return '<div class="card"><div style="color:var(--text2);font-size:13px">⚠ No se pudo obtener información del BCRA.</div></div>';
  const results = bcraData.results || {};
  const periodos = results.periodos || [];
  let maxSit=1, entidades=[], montoTotal=0;
  if (periodos.length) {
    entidades = periodos[0].entidades||[];
    if (entidades.length) { maxSit=Math.max(...entidades.map(e=>e.situacion||1)); montoTotal=entidades.reduce((s,e)=>s+(e.monto||0),0); }
  }
  // SSoT: score del servidor es la única fuente — sin recálculo JS
  const scoreEst    = scoreData?.score ?? null;
  const moraTecnica = scoreData?.mora_tecnica === true;
  const cc          = moraTecnica ? '#ca8a04' : scoreToColor(scoreEst);
  // Badge mora interna: el cliente tiene deuda con Piattelli pero score BCRA es bueno
  const tieneMoraInterna = (clienteLocal?.total_saldo > 0) || (clienteLocal?.bloquear_oportunidad === true);
  const badgeMoraInterna = (tieneMoraInterna && scoreEst >= 600)
    ? `<div style="margin-top:8px;background:#fef3c7;border:1px solid #d97706;border-radius:6px;padding:6px 10px;font-size:11px;color:#92400e;text-align:left">⚠ Score BCRA Protegido — Revisar Deuda Interna</div>`
    : '';
  const badgeMoraTecnica = moraTecnica
    ? `<div style="margin-top:8px;background:#fef9c3;border:1px solid #ca8a04;border-radius:6px;padding:6px 10px;font-size:11px;color:#92400e;text-align:left">⚠ ${esc(scoreData?.nota_mora_tecnica || 'Mora técnica por monto menor — riesgo moderado')}</div>`
    : '';
  const causales = chData?.results?.causales||[];
  let dchq=[]; causales.forEach(ca=>ca.entidades?.forEach(en=>dchq.push(...(en.detalle||[]))));
  const activos=dchq.filter(d=>!d.fechaPago||d.estadoMulta==='IMPAGA');

  const _debugHtml = `<div style="font-size:10px;font-family:monospace;color:#9ca3af;text-align:center;margin-top:6px;padding:4px;background:#f9fafb;border-radius:4px">[SVR=${scoreData?.score ?? 'null'} | MT=${scoreData?.mora_tecnica ?? '?'}]</div>`;

  if (scoreEst == null) {
    return `<div class="card"><div style="color:var(--text2);font-size:13px;text-align:center;padding:16px">⚠ Error de conexión — no se pudo obtener el score del servidor.<br><small>Cerrá y volvé a abrir para reintentar.</small></div></div>`;
  }

  let html = `<div class="card"><div class="card-title">Score estimado</div>
    <div class="score-hero"><div class="score-num" style="color:${cc}">${scoreEst}</div>
    <div><div class="score-rango" style="color:${cc}">${moraTecnica ? 'Revisar' : scoreToRango(scoreEst)}</div>
    <div style="font-size:11px;color:var(--text2);margin-top:2px">Sin historial Piattelli</div></div></div>
    <div class="score-bar-wrap"><div class="score-bar" style="width:${scoreEst/10}%;background:${cc}"></div></div>
    ${_debugHtml}
    ${badgeMoraTecnica}${badgeMoraInterna}
  </div>
  <div class="credito-box"><div class="credito-label">💡 Crédito sugerido</div>
    <div class="credito-monto">${calcularCredito(scoreEst)}</div>
  </div>`;

  if (bcraData.sin_deudas || !entidades.length) {
    html += `<div class="card"><div class="card-title">Situación BCRA</div>
    <div class="sit-grid"><div class="sit-chip"><span class="sit-chip-label">Situación</span><span class="sit-chip-val sit-1">1 — Normal</span></div>
    <div class="sit-chip"><span class="sit-chip-label">Deuda</span><span class="sit-chip-val">Sin deudas</span></div></div></div>`;
  } else {
    html += `<div class="card"><div class="card-title">Situación BCRA — ${periodos[0]?.periodo||''}</div>
    <div class="sit-grid">
      <div class="sit-chip"><span class="sit-chip-label">Peor sit.</span><span class="sit-chip-val sit-${maxSit}">Sit ${maxSit}</span></div>
      <div class="sit-chip"><span class="sit-chip-label">Entidades</span><span class="sit-chip-val">${entidades.length}</span></div>
      <div class="sit-chip"><span class="sit-chip-label">Monto</span><span class="sit-chip-val">$${fmtM(montoTotal*1000)}</span></div>
    </div>
    ${entidades.map(e=>`<div class="divider" style="margin:8px 0"></div>
    <div class="row-data"><span class="row-key">${esc(e.entidad||'')}</span><span class="row-val sit-${e.situacion||1}">Sit ${e.situacion||1} — $${fmtM((e.monto||0)*1000)}</span></div>`).join('')}
    </div>`;
  }

  html += `<div class="card"><div class="card-title">Cheques rechazados</div>`;
  if (!dchq.length) { html += `<div style="color:var(--green);font-size:13px">✓ Sin cheques rechazados</div>`; }
  else {
    html += `<div style="font-size:12px;color:var(--text2);margin-bottom:10px">${dchq.length} total · ${activos.length} impagos</div>`;
    dchq.slice(0,5).forEach(d => {
      const imp = !d.fechaPago||d.estadoMulta==='IMPAGA';
      html += `<div class="cheque-item"><div><div class="cheque-monto">$${fmtM(d.monto||0)}</div>
      <div style="font-size:10px;color:var(--text2)">${d.nroCheque||''} · ${d.fechaRechazo||''}</div></div>
      <span class="cheque-estado ${imp?'estado-impago':'estado-pagado'}">${imp?'IMPAGO':'PAGADO'}</span></div>`;
    });
    if (dchq.length>5) html += `<div style="font-size:11px;color:var(--text2);text-align:center;margin-top:8px">+${dchq.length-5} más</div>`;
  }
  html += '</div>';
  return html;
}

// ── CONSULTA CUIT ──
async function consultarCuit() {
  const cuit = document.getElementById('cuit-input').value.trim().replace(/\D/g,'');
  if (cuit.length < 10) { alert('CUIT inválido'); return; }
  showLoading('Consultando BCRA...');
  document.getElementById('consulta-resultado').innerHTML = '';
  const resEl = document.getElementById('consulta-resultado');
  try {
    showLoading('Consultando BCRA…');
    const [dd, cd, hd, serverScore] = await Promise.all([
      safeFetch(API + '/deudas/' + cuit),
      safeFetch(API + '/deudas/' + cuit + '/cheques'),
      safeFetch(API + '/deudas/' + cuit + '/historial'),
      safeFetch(API + '/fetch-score/' + cuit + '?fresh=1'),
    ]);
    hideLoading();
    if (!dd || dd._gateway_error) {
      resEl.innerHTML = `<div class="card" style="text-align:center;padding:20px">
        <div style="font-size:28px">⏳</div>
        <div style="font-weight:700;margin:8px 0">Servidor ocupado (502)</div>
        <div style="font-size:12px;color:var(--text2);margin-bottom:12px">Esperá unos segundos e intentá de nuevo.</div>
        <button onclick="consultarCuit()" style="background:var(--azul);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer">🔄 Forzar Recálculo</button>
      </div>`;
      return;
    }

    // Resolución bloqueante de Razón Social: BCRA no siempre devuelve denominacion
    // (cliente sin deuda vigente, CUIT nuevo, etc.) → fallback a /afip/ que busca
    // en BCRA historial → cartera comercial → saldos/facturas.
    if (!dd?.results?.denominacion?.trim()) {
      showLoading('Obteniendo razón social…');
      try {
        const afipData = await safeFetch(API + '/afip/' + cuit);
        if (afipData?.nombre && afipData.nombre !== cuit) {
          if (!dd.results) dd.results = {};
          dd.results.denominacion = afipData.nombre;
          console.log('[consulta] Razón social desde', afipData.fuente + ':', afipData.nombre);
        }
      } catch(e) { console.warn('[consulta] /afip/ falló:', e); }
      hideLoading();
    }

    // Guardar estado para generarPDF()
    window._ultimaConsulta = { cuit, dd, cd: cd || {}, hd, serverScore };

    console.log('[consulta] score=', serverScore?.score, 'mt=', serverScore?.mora_tecnica);
    renderConsulta(cuit, dd, cd || {}, hd, serverScore);
    lanzarAnalisisIA(cuit, dd, cd || {});
  } catch(e) {
    hideLoading();
    resEl.innerHTML = '<div class="card"><div style="color:var(--red)">Error consultando BCRA. Intentá de nuevo.</div></div>';
  }
}

function veredictoRapido(score, activosCheques, maxSit) {
  if (maxSit >= 4 || activosCheques > 0)
    return {texto:'⛔ No recibir cheque', bg:'#fee2e2', color:'var(--rojo)', borde:'var(--rojo)'};
  if (maxSit === 3 || score < 300)
    return {texto:'⚠ Riesgo elevado', bg:'#fef9c3', color:'#854d0e', borde:'var(--amarillo)'};
  if (score >= 600 && activosCheques === 0)
    return {texto:'✓ Apto para cheque', bg:'var(--verde-bg)', color:'var(--verde)', borde:'var(--verde)'};
  return {texto:'👁 Revisar con cautela', bg:'#fff7ed', color:'var(--naranja)', borde:'var(--naranja)'};
}

async function lanzarAnalisisIA(cuit, dd, cd) {
  const results=dd.results||{}, periodos=results.periodos||[];
  let maxSit=1, montoTotal=0, entidades=[];
  if (periodos.length){entidades=periodos[0].entidades||[];if(entidades.length){maxSit=Math.max(...entidades.map(e=>e.situacion||1));montoTotal=entidades.reduce((s,e)=>s+(e.monto||0),0);}}
  const causales=cd.results?.causales||[];let chqTotal=0;causales.forEach(ca=>ca.entidades?.forEach(en=>{chqTotal+=(en.detalle||[]).length;}));
  const scoreActual = window._ultimoScoreComercial || estimarScore(maxSit,dd.sin_deudas,cd);
  const creditoSug = calcularCredito(scoreActual);
  const prompt=`Sos analista de riesgo crediticio para Bodega Piattelli, Mendoza.\nDatos del cliente CUIT ${cuit}:\n- Situación BCRA: ${maxSit} (${maxSit===1?'Normal':maxSit===2?'Seguimiento':'Crítico'})\n- Deuda sistema financiero: $${fmtM(montoTotal*1000)}\n- Entidades: ${entidades.length}\n- Cheques rechazados: ${chqTotal}\n- Score Vende Seguro: ${scoreActual}/999 (${scoreToRango(scoreActual)})\n- Crédito sugerido: ${creditoSug}\n\nRedactá un análisis de riesgo breve (3-4 oraciones) en español informal orientado a un vendedor de vinos. El crédito sugerido es EXACTAMENTE ${creditoSug} — no sugerás un monto diferente. Sin listas, sin markdown, solo texto directo.`;
  try {
    const resp=await fetch(API+'/analizar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});
    const data=await resp.json();
    const iaEl=document.getElementById('ia-texto'),loadEl=document.getElementById('ia-loading');
    if(iaEl&&loadEl){loadEl.style.display='none';iaEl.style.display='block';iaEl.textContent=data.texto||'No se pudo generar el análisis.';if(!data.texto)iaEl.style.color='var(--text2)';}
  } catch(e){const l=document.getElementById('ia-loading');if(l)l.innerHTML='<span style="color:var(--text2);font-size:12px">Error generando análisis</span>';}
}

// ── safeFetch: sin retry en 502, detecta HTML, devuelve JSON o null ──────────
async function safeFetch(url, { retries = 0, timeoutMs = 15000 } = {}) {
  for (let i = 0; i <= retries; i++) {
    let r;
    try {
      r = await fetch(url, { signal: AbortSignal.timeout(timeoutMs) });
    } catch (e) {
      if (i < retries) { await new Promise(res => setTimeout(res, 2000)); continue; }
      console.warn('[safeFetch] red:', url, e?.message);
      return null;
    }
    if (r.status === 502 || r.status === 503 || r.status === 504) {
      console.warn('[safeFetch] gateway', r.status, url);
      return { _gateway_error: true, _status: r.status };   // sin retry
    }
    if (!r.ok) return null;
    let text;
    try { text = await r.text(); } catch(e) { return null; }
    if (text.trimStart().startsWith('<')) {
      console.warn('[safeFetch] HTML error page:', url);
      return { _gateway_error: true, _status: r.status };
    }
    try { return JSON.parse(text); } catch(e) { return null; }
  }
  return null;
}

function parseFecha(s) {
  if (!s) return new Date(9999,0,1);
  if (s.includes('/')) { const [d,m,y]=s.split('/'); return new Date(parseInt(y),parseInt(m)-1,parseInt(d)); }
  return new Date(s);
}
// Score completo sincrónico (con datos ya cargados) — espeja calcular_score_servidor
function calcularScoreCompletoSync(maxSit, sinDeudas, periodos, chData, histData) {
  let pts = 0;
  let penaltyArrastre = false;
  const entidades = periodos.length ? (periodos[0].entidades||[]) : [];
  const nroEnt = entidades.length;
  // montoM en millones (para concentración), montoMiles en miles (para sit1)
  const montoMiles = entidades.reduce((s,e) => s+(e.monto||0), 0);
  const montoM = montoMiles / 1000;

  // Periodos activos — usar historial 24m si está disponible
  const periodosParaNPH = histData?.results?.periodos?.length > 0
    ? histData.results.periodos
    : periodos;
  let nPH = 0, nPR = 0;
  periodosParaNPH.slice(0,24).forEach((p,i) => {
    if ((p.entidades||[]).some(e => (e.monto||0) > 0)) {
      nPH++; if (i < 6) nPR++;
    }
  });
  nPH = Math.min(nPH, nPR * 4);

  // 1. Situación BCRA ponderada — idéntica a calcular_score_servidor
  let pSit;
  if (maxSit === 1) {
    if      (montoMiles === 0)      pSit = 200; // sin historial bancario
    else if (montoMiles < 500000)   pSit = 250; // perfil pequeño
    else if (montoMiles < 2500000)  pSit = 300; // perfil moderado
    else if (nPH >= 12)             pSit = 400; // perfil consolidado
    else if (nPH >= 6)              pSit = 350;
    else if (nPH >= 2)              pSit = 300;
    else                            pSit = 250;
  } else if (maxSit === 2) pSit = 200;
  else if (maxSit === 3)   pSit = 50;
  else                     pSit = 0;
  pts += pSit;

  // 2. Historial 24m
  let pHist = 75;
  if (histData) {
    const pH = (histData.results||{}).periodos||[];
    // Regla 6 meses: sit≥3 en cualquiera → pHist=0 automático
    const sitGrave6m = pH.slice(0,6).some(p =>
      Math.max(...(p.entidades||[]).map(e=>e.situacion||1), 1) >= 3
    );
    if (sitGrave6m) {
      pHist = 0;
    } else {
      const malos = pH.slice(0,24).filter(p =>
        Math.max(...(p.entidades||[]).map(e=>e.situacion||1),1) > 1
      ).length;
      penaltyArrastre = (malos >= 2 && malos <= 5);
      if (malos > 5) pHist = 0;
      else if (malos > 0) pHist = malos<=2 ? 75 : 0;
      else pHist = nPH>=12 ? 150 : nPH>=3 ? 90 : nPH>=1 ? 40 : 60;
    }
  } else if (sinDeudas) { pHist = 60; }
  pts += pHist;

  // 3. Cheques
  let pCheq = 75;
  if (chData) {
    const causales = chData.results?.causales||[];
    let det=[]; causales.forEach(ca=>ca.entidades?.forEach(en=>det.push(...(en.detalle||[]))));
    const act = det.filter(d=>!d.fechaPago||d.estadoMulta==='IMPAGA');
    if (act.length > 5 || det.length >= 113) return 1;
    if (chData.sin_deudas||!det.length) pCheq = nPH>6?150:nPH>=1?70:40;
    else if (!act.length) pCheq=75;
    else pCheq=0;
  }
  // Riesgo cruzado: sit cap en cheques
  if (maxSit >= 3)                  pCheq = 0;
  else if (maxSit >= 2 && pCheq > 75) pCheq = 75;
  pts += pCheq;

  pts += 50; // mora neutral (comercial no tiene acceso)
  pts += 50; // DSO neutral
  pts += 30; // bodegas neutral

  // Concentración — montoM ya está en millones
  let pConc;
  if (!nroEnt||sinDeudas)          pConc=39;
  else if (nroEnt===1&&montoM<50)  pConc=35;
  else if (nroEnt<=2&&montoM<100)  pConc=28;
  else if (nroEnt<=3&&montoM<500)  pConc=20;
  else if (nroEnt<=5&&montoM<2000) pConc=10;
  else                             pConc=0;
  pts += pConc;

  // Penalidad arrastre → -25% global antes de techos
  if (penaltyArrastre) pts = Math.round(pts * 0.75);

  // Techos duros — idénticos al servidor
  if      (maxSit >= 5) pts = Math.min(pts, 1);
  else if (maxSit >= 4) pts = Math.min(pts, 250);
  else if (maxSit === 3) pts = Math.min(pts, 400);

  return Math.max(1, Math.min(999, Math.round(pts)));
}

function estimarScore(maxSit,sinDeudas,chData) {
  // Cálculo local simplificado — solo se usa como fallback
  // El score real viene del servidor via calcularScoreCompleto()
  let pts=0;
  if(sinDeudas||maxSit===1)pts+=400;else if(maxSit===2)pts+=200;else if(maxSit===3)pts+=50;
  pts+=75;
  const causales=chData?.results?.causales||[];let detalles=[];
  causales.forEach(ca=>ca.entidades?.forEach(en=>detalles.push(...(en.detalle||[]))));
  const activos=detalles.filter(d=>!d.fechaPago||d.estadoMulta==='IMPAGA');
  if(!detalles.length)pts+=150;else if(!activos.length)pts+=75;
  pts+=50;pts+=50;pts+=30;pts+=39;
  if(maxSit>=4)pts=Math.min(pts,250);else if(maxSit===3)pts=Math.min(pts,400);
  return Math.max(1,Math.min(999,Math.round(pts)));
}

// Score completo via servidor — igual que la app principal
async function calcularScoreCompleto(cuit) {
  try {
    const [deudasR, histR, chequesR] = await Promise.all([
      fetch(API + '/deudas/' + cuit).catch(() => null),
      fetch(API + '/deudas/' + cuit + '/historial').catch(() => null),
      fetch(API + '/deudas/' + cuit + '/cheques').catch(() => null)
    ]);
    const bcraData  = deudasR  && deudasR.ok  ? await deudasR.json()   : null;
    const histData  = histR    && histR.ok    ? await histR.json()      : null;
    const chData    = chequesR && chequesR.ok ? await chequesR.json()   : null;
    if (!bcraData) return null;

    const results  = bcraData.results || {};
    const periodos = results.periodos || [];
    const sinDeudas = bcraData.sin_deudas;
    let maxSit = 1, entidades = [], montoTotal = 0, nroEnt = 0;
    if (periodos.length) {
      entidades = periodos[0].entidades || [];
      nroEnt = entidades.length;
      if (entidades.length) {
        maxSit = Math.max(...entidades.map(e => e.situacion||1));
        montoTotal = entidades.reduce((s,e) => s+(e.monto||0), 0) / 1000;
      }
    } else if (sinDeudas) { maxSit = 1; }

    // Periodos activos (con monto > 0)
    let nPH = 0, nPR = 0;
    periodos.slice(0,24).forEach((p,i) => {
      if ((p.entidades||[]).some(e => (e.monto||0) > 0)) {
        nPH++;
        if (i < 6) nPR++;
      }
    });
    nPH = Math.min(nPH, nPR * 4);

    // 1. Situacion BCRA ponderada
    let pSit;
    if      (maxSit === 1 && nPH >= 12) pSit = 400;
    else if (maxSit === 1 && nPH >= 6)  pSit = 300;
    else if (maxSit === 1 && nPH >= 2)  pSit = 200;
    else if (maxSit === 1)              pSit = 150;
    else if (maxSit === 2)              pSit = 200;
    else if (maxSit === 3)              pSit = 50;
    else                                pSit = 0;

    // 2. Historial 24m
    let pHist = 75;
    if (histData) {
      const pH = (histData.results||{}).periodos || [];
      const malosMeses = pH.slice(0,24).filter(p =>
        Math.max(...(p.entidades||[]).map(e => e.situacion||1), 1) > 1
      ).length;
      if (malosMeses > 0) {
        pHist = malosMeses <= 2 ? 75 : 0;
      } else {
        pHist = nPH >= 12 ? 150 : nPH >= 3 ? 90 : nPH >= 1 ? 40 : 60;
      }
    } else if (sinDeudas) { pHist = 60; }

    // 3. Cheques
    let pCheq = 75;
    if (chData) {
      const causales = chData.results?.causales || [];
      let detalles = [];
      causales.forEach(ca => ca.entidades?.forEach(en => detalles.push(...(en.detalle||[]))));
      const activos = detalles.filter(d => !d.fechaPago || d.estadoMulta === 'IMPAGA');
      if (chData.sin_deudas || !detalles.length) {
        pCheq = nPH > 6 ? 150 : nPH >= 1 ? 70 : 40;
      } else if (!activos.length) { pCheq = 75; }
      else { pCheq = 0; }
    }

    // 4. Mora (no disponible en comercial = neutral)
    const pMora = 50;

    // 5. DSO neutral
    const pDSO = 50;

    // 6. Red bodegas neutral
    const pBodegas = 30;

    // 7. Concentracion
    let pConc;
    if (!nroEnt || sinDeudas)                    pConc = 39;
    else if (nroEnt === 1 && montoTotal < 50)    pConc = 35;
    else if (nroEnt <= 2 && montoTotal < 100)    pConc = 28;
    else if (nroEnt <= 3 && montoTotal < 500)    pConc = 20;
    else if (nroEnt <= 5 && montoTotal < 2000)   pConc = 10;
    else                                          pConc = 0;

    let pts = pSit + pHist + pCheq + pMora + pDSO + pBodegas + pConc;
    // Techos duros — idénticos al servidor
    if      (maxSit >= 5) pts = Math.min(pts, 1);
    else if (maxSit >= 4) pts = Math.min(pts, 250);
    else if (maxSit === 3) pts = Math.min(pts, 400);

    const score = Math.max(1, Math.min(999, Math.round(pts)));
    return {
      score,
      rango: scoreToRango(score),
      color: scoreToColor(score),
      emoji: score>=700?'🟢':score>=400?'🟡':score>=200?'🟠':'🔴'
    };
  } catch(e) { return null; }
}
function calcularCredito(s){
  if(s>=900)return '$800.000 – $2.000.000';
  if(s>=700)return '$500.000 – $800.000';
  if(s>=500)return '$200.000 – $500.000';
  if(s>=400)return '$100.000 – $200.000';
  if(s>=300)return 'Hasta $100.000 (contado previo)';
  if(s>=200)return 'Solo contado anticipado';
  return 'No recomendado';
}
function scoreToColor(s){if(!s)return'var(--text2)';if(s>=700)return'var(--green)';if(s>=400)return'var(--yellow)';if(s>=200)return'var(--orange)';return'var(--red)';}
function scoreToRango(s){if(!s)return'—';if(s>=700)return'Excelente';if(s>=400)return'Bueno';if(s>=200)return'Revisar';if(s>=100)return'Alto riesgo';return'Rechazar';}
function sitBg(s){const b={1:'rgba(74,222,128,0.1)',2:'rgba(251,191,36,0.1)',3:'rgba(251,146,60,0.1)',4:'rgba(248,113,113,0.1)',5:'rgba(248,113,113,0.1)',6:'rgba(248,113,113,0.1)'};return b[s]||b[1];}
function fmtM(n){if(!n)return'0';if(n>=1e9)return'$'+(n/1e6).toFixed(0)+'MM';if(n>=1e6)return'$'+(n/1e6).toFixed(1)+'MM';if(n>=1e3)return'$'+(n/1e3).toFixed(0)+'K';return '$'+Math.round(n).toLocaleString('es-AR');}
function fmtFull(n){if(!n)return'0';return Math.round(n).toLocaleString('es-AR');}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

// Normalizar para búsqueda fuzzy
function matchBusqueda(nombre, query) {
  if (!query) return true;
  const n = nombre.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const q = query.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  // Match parcial por cualquier palabra
  return q.split(' ').every(p => p.length < 2 || n.includes(p));
}
