<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vende Seguro — Comercial</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --azul: #003366;
  --azul-medio: #1a56a0;
  --azul-claro: #2563eb;
  --azul-suave: #eff6ff;
  --azul-borde: #bfdbfe;
  --bg: #f0f5ff;
  --surface: #ffffff;
  --texto: #0f172a;
  --texto2: #64748b;
  --verde: #16a34a;
  --verde-bg: #dcfce7;
  --amarillo: #ca8a04;
  --naranja: #ea580c;
  --rojo: #dc2626;
  --rojo-bg: #fee2e2;
  --radius: 12px;
  --tab-h: 62px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--texto);min-height:100vh;}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;background:linear-gradient(135deg,#003366 0%,#1a56a0 60%,#2563eb 100%);}
.login-logo{width:64px;height:64px;background:rgba(255,255,255,0.15);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:20px;box-shadow:0 8px 32px rgba(0,0,0,0.2);}
.login-title{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:#fff;margin-bottom:4px;letter-spacing:-0.5px;}
.login-sub{font-size:13px;color:#93c5fd;margin-bottom:36px;font-style:italic;}
.login-form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;}
.f-label{font-size:11px;font-weight:600;color:#93c5fd;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:5px;}
.f-input{width:100%;background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.2);border-radius:10px;padding:13px 15px;font-family:'DM Sans',sans-serif;font-size:15px;color:#fff;outline:none;transition:border-color .2s;}
.f-input:focus{border-color:rgba(255,255,255,.6);}
.f-input::placeholder{color:rgba(255,255,255,.4);}
.btn-login{width:100%;background:#fff;border:none;border-radius:10px;padding:15px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;color:var(--azul);cursor:pointer;margin-top:6px;}
.login-err{background:rgba(220,38,38,.2);border:1px solid rgba(220,38,38,.4);border-radius:8px;padding:11px 13px;font-size:13px;color:#fca5a5;text-align:center;display:none;}

/* APP */
#app{display:none;flex-direction:column;min-height:100vh;}
.app-header{background:var(--azul);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,51,102,.3);}
.hdr-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:#fff;}
.hdr-sub{font-size:11px;color:#93c5fd;}
.btn-logout{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 12px;font-size:12px;color:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;}

.tab-content{flex:1;overflow-y:auto;padding-bottom:calc(var(--tab-h) + 16px);}
.tab-pane{display:none;padding:16px;}
.tab-pane.active{display:block;}

.bottom-tabs{position:fixed;bottom:0;left:0;right:0;height:var(--tab-h);background:var(--surface);border-top:1px solid var(--azul-borde);display:flex;z-index:100;box-shadow:0 -2px 8px rgba(37,99,235,.08);}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;color:var(--texto2);cursor:pointer;font-family:'DM Sans',sans-serif;transition:color .2s;}
.tab-btn.active{color:var(--azul-claro);}
.tab-icon{font-size:20px;line-height:1;}
.tab-label{font-size:10px;font-weight:600;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--azul-borde);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(37,99,235,.06);}
.card-title{font-size:11px;font-weight:600;color:var(--azul-claro);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;}

/* BUSCAR */
.buscar-input{width:100%;padding:10px 14px;border:1.5px solid var(--azul-borde);border-radius:10px;font-size:14px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--texto);outline:none;margin-bottom:12px;box-shadow:0 1px 4px rgba(37,99,235,.06);}
.buscar-input:focus{border-color:var(--azul-claro);}

/* FILTROS */
.filter-row{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;}
.filter-chip{background:var(--surface);border:1px solid var(--azul-borde);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:500;color:var(--texto2);cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;transition:all .15s;}
.filter-chip.active{background:var(--azul-claro);color:#fff;border-color:var(--azul-claro);}

/* CLIENTE CARD */
.cliente-card{background:var(--surface);border:1px solid var(--azul-borde);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 4px rgba(37,99,235,.06);}
.cliente-card.alerta{border-left:3px solid var(--rojo);}
.cli-row1{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;}
.cli-nombre{font-size:14px;font-weight:600;flex:1;color:var(--texto);}
.score-badge{font-size:13px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--azul-suave);font-family:'Syne',sans-serif;}
.cli-row2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.cli-ciudad{font-size:11px;color:var(--texto2);}
.sit-badge{font-size:10px;font-weight:600;border-radius:4px;padding:2px 6px;}
.alerta-badge{font-size:10px;font-weight:600;background:var(--rojo-bg);color:var(--rojo);border-radius:4px;padding:2px 6px;}
.saldo-badge{font-size:10px;font-weight:600;background:#dbeafe;color:var(--azul-claro);border-radius:4px;padding:2px 6px;}

/* OPORT */
.oport-card{background:var(--surface);border:1px solid var(--azul-borde);border-left:3px solid var(--verde);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 4px rgba(37,99,235,.06);}
.oport-score{font-size:24px;font-weight:800;font-family:'Syne',sans-serif;color:var(--verde);}
.oport-nombre{font-size:14px;font-weight:600;color:var(--texto);}
.oport-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.oport-tag{font-size:10px;font-weight:600;padding:3px 8px;border-radius:4px;background:var(--verde-bg);color:var(--verde);}
.oport-tag.urgente{background:var(--rojo-bg);color:var(--rojo);}
.oport-tag.medio{background:#fef9c3;color:#854d0e;}

/* SCORE DISPLAY */
.score-hero{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.score-num{font-size:48px;font-weight:800;letter-spacing:-2px;line-height:1;font-family:'Syne',sans-serif;}
.score-rango{font-size:16px;font-weight:700;}
.score-bar-wrap{background:var(--bg);border-radius:4px;height:6px;overflow:hidden;margin-top:10px;}
.score-bar{height:100%;border-radius:4px;transition:width .6s ease;}
.credito-box{background:linear-gradient(135deg,var(--azul-suave),#dbeafe);border:1px solid var(--azul-borde);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.credito-label{font-size:11px;color:var(--azul-claro);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:6px;}
.credito-monto{font-size:22px;font-weight:800;font-family:'Syne',sans-serif;color:var(--azul);}

/* SIT CHIPS */
.sit-grid{display:flex;flex-wrap:wrap;gap:8px;}
.sit-chip{background:var(--azul-suave);border-radius:8px;padding:8px 12px;font-size:12px;flex:1;min-width:90px;}
.sit-chip-label{color:var(--texto2);font-size:10px;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:2px;}
.sit-chip-val{font-weight:700;font-size:13px;}
.sit-1{color:var(--verde)}.sit-2{color:var(--amarillo)}.sit-3{color:var(--naranja)}.sit-4,.sit-5,.sit-6{color:var(--rojo);}

/* CHEQUES */
.cheque-item{background:var(--azul-suave);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.cheque-estado{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;}
.impago{background:var(--rojo-bg);color:var(--rojo);}
.pagado{background:var(--verde-bg);color:var(--verde);}

/* MODAL */
#detail-modal{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:200;overflow-y:auto;}
.modal-header{background:var(--azul);padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;}
.btn-back{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:0;}
.modal-title{font-size:14px;font-weight:600;flex:1;color:#fff;line-height:1.3;}
.modal-body{padding:16px;}
.modal-tabs{display:flex;border-bottom:2px solid var(--azul-borde);margin-bottom:14px;}
.modal-tab{flex:1;padding:10px 8px;text-align:center;font-size:12px;font-weight:600;color:var(--texto2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;}
.modal-tab.active{color:var(--azul-claro);border-bottom-color:var(--azul-claro);}

/* FACTURAS */
.total-box{background:linear-gradient(135deg,var(--azul),var(--azul-medio));border-radius:10px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.total-label{font-size:11px;color:#93c5fd;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.total-monto{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#fff;}
.factura-item{background:var(--surface);border-radius:10px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--azul-borde);box-shadow:0 1px 4px rgba(37,99,235,.06);}
.factura-item.vencida{border-left:3px solid var(--rojo);}
.factura-item.proxima{border-left:3px solid var(--amarillo);}
.factura-item.vigente{border-left:3px solid var(--verde);}
.factura-row1{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.factura-nro{font-size:11px;color:var(--texto2);font-family:monospace;}
.factura-saldo{font-size:16px;font-weight:800;font-family:'Syne',sans-serif;color:var(--azul);}
.factura-fechas{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;}
.factura-fecha{font-size:11px;color:var(--texto2);}
.tag-vencida{background:var(--rojo-bg);color:var(--rojo);font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;display:inline-block;margin-top:4px;}
.tag-proxima{background:#fef9c3;color:#854d0e;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;display:inline-block;margin-top:4px;}
.tag-vigente{background:var(--verde-bg);color:var(--verde);font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;display:inline-block;margin-top:4px;}

/* ROW DATA */
.row-data{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--azul-borde);}
.row-data:last-child{border-bottom:none;}
.row-key{font-size:12px;color:var(--texto2);}
.row-val{font-size:13px;font-weight:600;text-align:right;}
.divider{height:1px;background:var(--azul-borde);margin:8px 0;}

/* UTILS */
.ia-loading{display:flex;align-items:center;gap:10px;color:var(--texto2);font-size:13px;}
.ia-texto{font-size:13px;line-height:1.7;color:var(--texto);}
.spinner{width:18px;height:18px;border:2px solid var(--azul-borde);border-top-color:var(--azul-claro);border-radius:50%;animation:spin .8s linear infinite;}
.spinner-lg{width:36px;height:36px;border-width:3px;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:40px 24px;color:var(--texto2);}
.empty-icon{font-size:36px;margin-bottom:10px;}
.empty-text{font-size:14px;line-height:1.6;}
.section-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;margin-bottom:4px;color:var(--azul);letter-spacing:-.5px;}
.section-sub{font-size:13px;color:var(--texto2);margin-bottom:14px;}
#loading-overlay{position:fixed;inset:0;background:rgba(240,245,255,.9);display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:16px;}
.loading-text{font-size:14px;color:var(--texto2);}

/* SEARCH BOX */
.search-box{background:var(--surface);border:1.5px solid var(--azul-borde);border-radius:var(--radius);padding:12px 14px;display:flex;gap:10px;align-items:center;margin-bottom:14px;box-shadow:0 1px 4px rgba(37,99,235,.06);}
.search-input{flex:1;background:none;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--texto);}
.search-input::placeholder{color:var(--texto2);}
.btn-search{background:var(--azul-claro);border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;color:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-logo">🍷</div>
  <div class="login-title">Vende Seguro</div>
  <div class="login-sub">Módulo Comercial — Piattelli</div>
  <div class="login-form">
    <div><div class="f-label">Nombre completo</div>
      <input class="f-input" id="inp-nombre" type="text" placeholder="Ej: Alejandro Valan" autocomplete="name"></div>
    <div><div class="f-label">CUIT del comercial</div>
      <input class="f-input" id="inp-cuit" type="tel" placeholder="Ej: 20123456789" inputmode="numeric"></div>
    <div><div class="f-label">PIN de acceso</div>
      <input class="f-input" id="inp-pin" type="password" placeholder="••••••••" autocomplete="off"></div>
    <div class="login-err" id="login-error">Datos incorrectos.</div>
    <button class="btn-login" onclick="doLogin()">Ingresar →</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-header">
    <div>
      <div class="hdr-name" id="header-name">—</div>
      <div class="hdr-sub" id="header-cartera">— clientes</div>
    </div>
    <button class="btn-logout" onclick="doLogout()">Salir</button>
  </div>
  <div class="tab-content">
    <div class="tab-pane active" id="tab-consulta">
      <div class="section-title">Consulta CUIT</div>
      <div class="section-sub">Situación BCRA, score y análisis de riesgo</div>
      <div class="search-box">
        <input class="search-input" id="cuit-input" type="tel" inputmode="numeric" placeholder="CUIT sin guiones" maxlength="11">
        <button class="btn-search" onclick="consultarCuit()">Buscar</button>
      </div>
      <div id="consulta-resultado"></div>
    </div>
    <div class="tab-pane" id="tab-cartera">
      <div class="section-title">Mi Cartera</div>
      <div class="section-sub" id="cartera-subtitle">Clientes activos</div>
      <input type="text" class="buscar-input" id="buscar-cartera" placeholder="🔍 Buscar cliente..." oninput="buscarEnCartera(this.value)" translate="no">
      <div class="filter-row">
        <button class="filter-chip active" onclick="filtrarCartera('todos',this)">Todos</button>
        <button class="filter-chip" onclick="filtrarCartera('alertas',this)">⚠ Alertas</button>
        <button class="filter-chip" onclick="filtrarCartera('saldo',this)">💰 Con saldo</button>
      </div>
      <div id="cartera-lista"></div>
    </div>
    <div class="tab-pane" id="tab-oport">
      <div class="section-title">Oportunidades</div>
      <div class="section-sub">Score ≥ 700 · Ordenado por score</div>
      <input type="text" class="buscar-input" id="buscar-oport" placeholder="🔍 Buscar cliente..." oninput="buscarEnOport(this.value)" translate="no">
      <div id="oport-lista"></div>
    </div>
  </div>
  <div class="bottom-tabs">
    <button class="tab-btn active" onclick="switchTab('consulta',this)">
      <span class="tab-icon">🔍</span><span class="tab-label">Consulta</span>
    </button>
    <button class="tab-btn" onclick="switchTab('cartera',this)">
      <span class="tab-icon">📋</span><span class="tab-label">Cartera</span>
    </button>
    <button class="tab-btn" onclick="switchTab('oport',this)">
      <span class="tab-icon">⚡</span><span class="tab-label">Oportunidades</span>
    </button>
  </div>
</div>

<!-- MODAL -->
<div id="detail-modal">
  <div class="modal-header">
    <button class="btn-back" onclick="closeModal()">←</button>
    <div class="modal-title" id="modal-title">Cliente</div>
  </div>
  <div class="modal-body" id="modal-body"></div>
</div>

<div id="loading-overlay">
  <div class="spinner spinner-lg"></div>
  <div class="loading-text" id="loading-text">Cargando...</div>
</div>

<script>
const API = 'https://bcra-proxy-xykm.onrender.com';
const PIN_COMERCIAL = 'PIATTELLI2025';
const CREDITO_MAX = 2000000; // Hard cap absoluto

const VENDEDORES = {
  'Adrian Arango':            '20208913604',
  'Alejandro Valan':          '20207619923',
  'Anabel Borrageiros':       '27308869313',
  'Ezequiel Mallima':         '20393831821',
  'Marcelo Fernandez':        '20251483680',
  'Pablo Perticone':          '20224421371',
  'Roberto Pascual':          '20206068834',
  'Sergio Piatanesi':         '20217157332',
  'Valeria Gutierrez Castex': '27224289966',
};

let SESSION = null, CARTERA_LOCAL = [], ALERTAS = [], SALDOS_MAP = {};
let _buscarCartera = '', _buscarOport = '';

// ─── LOGIN ───────────────────────────────────────────
function doLogin() {
  const nombre = document.getElementById('inp-nombre').value.trim();
  const cuit   = document.getElementById('inp-cuit').value.trim().replace(/\D/g,'');
  const pin    = document.getElementById('inp-pin').value.trim();
  const err    = document.getElementById('login-error');
  err.style.display = 'none';
  if (!nombre||!cuit||!pin){err.textContent='Completá todos los campos.';err.style.display='block';return;}
  if (pin !== PIN_COMERCIAL){err.textContent='PIN incorrecto.';err.style.display='block';return;}
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const key = Object.keys(VENDEDORES).find(k => norm(k) === norm(nombre));
  if (!key){err.textContent='Nombre no encontrado.';err.style.display='block';return;}
  if (cuit !== VENDEDORES[key]){err.textContent='CUIT no coincide.';err.style.display='block';return;}
  SESSION = {nombre:key, cuit};
  iniciarApp();
}

function doLogout() {
  SESSION=null; CARTERA_LOCAL=[]; SALDOS_MAP={};
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('inp-pin').value='';
  document.getElementById('consulta-resultado').innerHTML='';
}

// ─── INIT ────────────────────────────────────────────
async function iniciarApp() {
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('header-name').textContent=SESSION.nombre;
  showLoading('Cargando cartera...');
  try {
    const [cr,ar] = await Promise.all([
      fetch(API+'/cartera-comercial/'+encodeURIComponent(SESSION.nombre)).catch(()=>null),
      fetch(API+'/alertas').catch(()=>null)
    ]);
    if(cr&&cr.ok) CARTERA_LOCAL=await cr.json();
    if(ar&&ar.ok){const ad=await ar.json();ALERTAS=ad.alertas||[];}
  } catch(e){}
  hideLoading();
  const n=CARTERA_LOCAL.length;
  document.getElementById('header-cartera').textContent=n+' cliente'+(n!==1?'s':'');
  document.getElementById('cartera-subtitle').textContent=n+' clientes activos';
  renderCartera('todos');
  renderOportunidades();
  cargarSaldosCartera();
  calcularYGuardarScoresCartera();
}

// ─── CALCULAR SCORES DE TODA LA CARTERA AL INICIO ────
async function calcularYGuardarScoresCartera() {
  // Ver cuántos ya tienen score
  const sinScore = CARTERA_LOCAL.filter(c => !c.score);
  if (!sinScore.length) {
    console.log('[scoring] Todos los clientes ya tienen score.');
    renderOportunidades();
    return;
  }
  console.log('[scoring] Calculando scores para', sinScore.length, 'clientes...');

  let calculados = 0;
  const scores = {};

  for (let i = 0; i < CARTERA_LOCAL.length; i++) {
    const c = CARTERA_LOCAL[i];
    if (c.score) continue; // ya tiene score, saltar

    try {
      const [dr, chr, hr] = await Promise.all([
        fetch(API + '/deudas/' + c.cuit).catch(() => null),
        fetch(API + '/deudas/' + c.cuit + '/cheques').catch(() => null),
        fetch(API + '/deudas/' + c.cuit + '/historial').catch(() => null)
      ]);

      const dd = (dr && dr.ok) ? await dr.json() : null;
      const cd = (chr && chr.ok) ? await chr.json() : null;
      const hd = (hr && hr.ok) ? await hr.json() : null;

      if (!dd) continue;

      const periodos = dd.results?.periodos || [];
      let maxSit = 1, entidades = [];
      if (periodos.length) {
        entidades = periodos[0].entidades || [];
        if (entidades.length) maxSit = Math.max(...entidades.map(e => e.situacion || 1));
      } else if (dd.sin_deudas) { maxSit = 1; }

      const score = calcularScoreCompleto(maxSit, dd.sin_deudas, periodos, cd, hd);
      CARTERA_LOCAL[i].score = score;
      CARTERA_LOCAL[i].ultimaSit = maxSit;
      CARTERA_LOCAL[i].last_update = new Date().toISOString();
      scores[c.cuit] = { scoreCompleto: score, ultimaSit: maxSit };
      calculados++;

      // Cada 20 clientes, actualizar UI y guardar parcial
      if (calculados % 20 === 0) {
        renderCartera(document.querySelector('.filter-chip.active')?.textContent?.includes('Alertas') ? 'alertas' :
          document.querySelector('.filter-chip.active')?.textContent?.includes('saldo') ? 'saldo' : 'todos');
        renderOportunidades();
        guardarScoresServidor(scores);
      }

      // Pausa para no saturar el servidor
      await new Promise(r => setTimeout(r, 800));

    } catch(e) { continue; }
  }

  // Guardado final
  if (Object.keys(scores).length > 0) guardarScoresServidor(scores);
  renderCartera('todos');
  renderOportunidades();
  console.log('[scoring] Completado:', calculados, 'scores calculados.');
}

async function guardarScoresServidor(scores) {
  try {
    const r = await fetch(API + '/alertas');
    const existing = r.ok ? await r.json() : {alertas:[], cartera:[]};
    const carteraMap = {};
    (existing.cartera || []).forEach(c => { carteraMap[c.cuit] = c; });
    Object.keys(scores).forEach(cuit => {
      if (!carteraMap[cuit]) carteraMap[cuit] = {cuit};
      carteraMap[cuit].scoreCompleto = scores[cuit].scoreCompleto;
      carteraMap[cuit].ultimaSit = scores[cuit].ultimaSit;
    });
    await fetch(API + '/alertas', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        alertas: existing.alertas || [],
        ultima_verif: existing.ultima_verif || '',
        cartera: Object.values(carteraMap)
      })
    });
    console.log('[scoring] Scores guardados en servidor:', Object.keys(scores).length);
  } catch(e) { console.warn('[scoring] Error guardando:', e); }
}

function normNombre(s){
  return String(s||'').trim().toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}

// Fuzzy match: tolera tildes, mayúsculas, palabras incompletas
function matchBusqueda(nombre, q) {
  if (!q) return true;
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ');
  const n = norm(nombre), qn = norm(q);
  // Cada palabra del query debe aparecer en alguna parte del nombre
  return qn.split(' ').filter(p=>p.length>0).every(p => n.includes(p));
}

function buscarEnCartera(q){
  _buscarCartera=q.trim().toLowerCase();
  const btn=document.querySelector('.filter-chip.active');
  const filtro=btn?.textContent?.includes('Alertas')?'alertas':btn?.textContent?.includes('saldo')?'saldo':'todos';
  renderCartera(filtro);
}

}

function renderCartera(filtro){
  const alertaCuits=new Set(ALERTAS.map(a=>a.cuit));
  let lista=CARTERA_LOCAL;
  if(filtro==='alertas') lista=lista.filter(c=>alertaCuits.has(c.cuit));
  else if(filtro==='saldo') lista=lista.filter(c=>getSaldos(c.nombre));
  if(_buscarCartera) lista=lista.filter(c=>matchBusqueda(c.nombre,_buscarCartera));

  const el=document.getElementById('cartera-lista');
  if(!lista.length){
    el.innerHTML='<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">Sin clientes en este filtro</div></div>';
    return;
  }
  el.innerHTML=lista.map(c=>{
    const sit=c.ultimaSit||1, score=c.score||null;
    const tieneAlerta=alertaCuits.has(c.cuit), saldosData=getSaldos(c.nombre);
    const sc=scoreToColor(score);
    return `<div class="cliente-card${tieneAlerta?' alerta':''}" onclick="abrirModalCliente('${esc(c.cuit)}','${esc(c.nombre)}')">
      <div class="cli-row1">
        <div class="cli-nombre">${esc(c.nombre)}</div>

      </div>
      <div class="cli-row2">
        <span class="cli-ciudad">${esc(c.ciudad||'')}</span>
        <span class="sit-badge sit-${sit}" style="background:${sitBg(sit)}">${sit===1?'✓ Normal':'Sit '+sit}</span>
        ${tieneAlerta?'<span class="alerta-badge">⚠ Alerta</span>':''}
        ${saldosData?`<span class="saldo-badge">💰 $${fmtM(saldosData.total_saldo)}</span>`:''}
      </div>
    </div>`;
  }).join('');
}

// ─── OPORTUNIDADES ────────────────────────────────────
async function renderOportunidades() {
  const el=document.getElementById('oport-lista');
  el.innerHTML='<div class="empty"><div class="spinner" style="margin:0 auto 12px"></div><div class="empty-text">Analizando oportunidades...</div></div>';

  await cargarUltimasCompras();

  const alertaCuits=new Set(ALERTAS.map(a=>a.cuit));

  // REGLA: score >= 700, sin alertas, sit normal
  const candidatos=CARTERA_LOCAL
    .filter(c=>(c.score||0)>=700 && !alertaCuits.has(c.cuit) && (c.ultimaSit||1)===1)
    .map(c=>{
      const dias=diasDesdeUltimaCompra(c.nombre);
      const saldosData=getSaldos(c.nombre);
      let motivo, tagClass;
      if(dias===null)       {motivo='Sin historial de compras';tagClass='medio';}
      else if(dias>=45)     {motivo=`Sin compras hace ${dias} días — contactar urgente`;tagClass='urgente';}
      else if(dias>=30)     {motivo=`Sin compras hace ${dias} días — visitar`;tagClass='urgente';}
      else if(dias>=15)     {motivo=`Última compra hace ${dias} días`;tagClass='medio';}
      else                  {motivo=`Compra reciente — hace ${dias} días`;tagClass='';}
      return {...c, dias, motivo, tagClass, tieneSaldo:!!(saldosData&&saldosData.total_saldo>0)};
    })
    // Ordenar por score descendente (mayor a menor)
    .sort((a,b)=>(b.score||0)-(a.score||0));

  if(!candidatos.length){
    el.innerHTML='<div class="empty"><div class="empty-icon">⚡</div><div class="empty-text">Corré la verificación de cartera primero para calcular scores.</div></div>';
    return;
  }

  let lista=_buscarOport?candidatos.filter(c=>matchBusqueda(c.nombre,_buscarOport)):candidatos;
  if(!lista.length){
    el.innerHTML=`<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">Sin resultados para "${esc(_buscarOport)}"</div></div>`;
    return;
  }

  el.innerHTML=lista.map(c=>{
    const score=c.score||0;
    const tags=[`Score ${score>=800?'Excelente':'Bueno'} (${score})`];
    if(c.dias===null||c.dias>=30) tags.push('🔥 Contactar');
    if(!c.tieneSaldo) tags.push('Sin deuda pendiente');
    if(c.tieneSaldo) tags.push('💰 Saldo pdte.');
    return `<div class="oport-card" onclick="abrirModalCliente('${c.cuit}','${esc(c.nombre)}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div class="oport-nombre">${esc(c.nombre)}</div>
        <div class="oport-score">${score}</div>
      </div>
      <div style="font-size:11px;color:var(--texto2);margin-top:2px">${esc(c.ciudad||'')}</div>
      <div style="font-size:12px;font-weight:600;margin-top:4px;color:${c.tagClass==='urgente'?'var(--rojo)':c.tagClass==='medio'?'var(--amarillo)':'var(--verde)'}">${c.motivo}</div>
      <div class="oport-tags">${tags.map(t=>`<span class="oport-tag ${t.includes('🔥')?'urgente':''}">${t}</span>`).join('')}</div>
    </div>`;
  }).join('');
}

// ─── ÚLTIMAS COMPRAS ──────────────────────────────────
async function cargarUltimasCompras(){
  if(window.ULTIMAS_COMPRAS) return;
  window.ULTIMAS_COMPRAS={};
  try{
    const r=await fetch(API+'/dso-ventas');
    if(!r.ok) return;
    const data=await r.json();
    (data.ventas||[]).forEach(v=>{
      if(!v.cliente||!v.fecha) return;
      const cn=normNombre(v.cliente), fecha=new Date(v.fecha);
      if(!isNaN(fecha)&&(!window.ULTIMAS_COMPRAS[cn]||fecha>window.ULTIMAS_COMPRAS[cn]))
        window.ULTIMAS_COMPRAS[cn]=fecha;
    });
  }catch(e){}
}

function diasDesdeUltimaCompra(nombre){
  if(!window.ULTIMAS_COMPRAS) return null;
  const fecha=window.ULTIMAS_COMPRAS[normNombre(nombre)];
  if(!fecha) return null;
  const hoy=new Date();hoy.setHours(0,0,0,0);
  return Math.floor((hoy-fecha)/86400000);
}

    <div class="sit-chip"><span class="sit-chip-label">Monto total</span><span class="sit-chip-val">$${fmtM(montoTotal*1000)}</span></div></div>
    ${entidades.map(e=>`<div class="divider"></div><div class="row-data"><span class="row-key">${esc(e.entidad||'')}</span><span class="row-val sit-${e.situacion||1}">Sit ${e.situacion||1} — $${fmtM((e.monto||0)*1000)}</span></div>`).join('')}</div>`;
  }

  html+=`<div class="card"><div class="card-title">Cheques rechazados</div>`;
  if(!dchq.length) html+=`<div style="color:var(--verde);font-size:13px;font-weight:600">✓ Sin cheques rechazados</div>`;
  else{
    html+=`<div style="font-size:12px;color:var(--texto2);margin-bottom:8px">${dchq.length} total · ${activos.length} impagos</div>`;
    dchq.slice(0,5).forEach(d=>{const imp=!d.fechaPago||d.estadoMulta==='IMPAGA';
      html+=`<div class="cheque-item"><div><div style="font-weight:700;font-size:13px">$${fmtM(d.monto||0)}</div>
      <div style="font-size:10px;color:var(--texto2)">${d.nroCheque||''} · ${d.fechaRechazo||''}</div></div>
      <span class="cheque-estado ${imp?'impago':'pagado'}">${imp?'IMPAGO':'PAGADO'}</span></div>`;});
    if(dchq.length>5) html+=`<div style="font-size:11px;color:var(--texto2);text-align:center;margin-top:6px">+${dchq.length-5} más</div>`;
  }
  html+=`</div><div class="card"><div class="card-title">Análisis IA</div>
    <div class="ia-loading" id="ia-loading"><div class="spinner"></div><span>Generando análisis...</span></div>
    <div class="ia-texto" id="ia-texto" style="display:none"></div></div>`;
  document.getElementById('consulta-resultado').innerHTML=html;
}

async function lanzarAnalisisIA(cuit,dd,cd,hd){
  const results=dd.results||{},periodos=results.periodos||[];
  let maxSit=1,montoTotal=0,entidades=[];
  if(periodos.length){entidades=periodos[0].entidades||[];if(entidades.length){maxSit=Math.max(...entidades.map(e=>e.situacion||1));montoTotal=entidades.reduce((s,e)=>s+(e.monto||0),0);}}
  const causales=cd.results?.causales||[];let chqTotal=0;
  causales.forEach(ca=>ca.entidades?.forEach(en=>{chqTotal+=(en.detalle||[]).length;}));
  const scoreActual=window._ultimoScoreComercial||400;
  const creditoSug=calcularCredito(scoreActual);

  // SYSTEM PROMPT — el crédito del sistema es verdad absoluta, hard cap $2.000.000
  const prompt=`Sos analista de riesgo crediticio senior para Bodega Piattelli Mendoza.
Datos objetivos del cliente CUIT ${cuit}:
- Situación BCRA: ${maxSit} (${maxSit===1?'Normal':maxSit===2?'Seguimiento especial':'Crítico'})
- Deuda total sistema financiero: $${fmtM(montoTotal*1000)}
- Cantidad de entidades: ${entidades.length}
- Cheques rechazados BCRA: ${chqTotal}
- Score Vende Seguro: ${scoreActual}/999 (${scoreToRango(scoreActual)})
- Crédito sugerido por el sistema: ${creditoSug}

INSTRUCCIONES ESTRICTAS:
1. El crédito sugerido es EXACTAMENTE "${creditoSug}". No sugerís otro monto bajo ninguna circunstancia.
2. El tope máximo absoluto es $2.000.000. Nunca superarlo.
3. Justificá ese monto basándote en los datos reales del BCRA.
4. Redactá 3-4 oraciones en español informal orientado a un vendedor de vinos.
5. Sin listas, sin markdown, solo texto directo.`;

  try{
    const resp=await fetch(API+'/analizar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});
    const data=await resp.json();
    const iaEl=document.getElementById('ia-texto'),loadEl=document.getElementById('ia-loading');
    if(iaEl&&loadEl){loadEl.style.display='none';iaEl.style.display='block';iaEl.textContent=data.texto||'No se pudo generar el análisis.';}
  }catch(e){const l=document.getElementById('ia-loading');if(l)l.innerHTML='<span style="color:var(--texto2);font-size:12px">Error generando análisis.</span>';}
}

function parseFecha(s){
  if(!s)return new Date(9999,0,1);
  if(s.includes('/')){const[d,m,y]=s.split('/');return new Date(parseInt(y),parseInt(m)-1,parseInt(d));}
  return new Date(s);
}

// ─── MOTOR DE SCORING — ESPEJO EXACTO DE APP PRINCIPAL ──────────────
// Lógica extraída de calcularVendeScore() de la app admin.
// Diferencias esperadas vs admin: DSO=50 neutral, Piattelli=50 neutral, Bodegas=30 neutral
// Concentración: usa entidades del periodo actual
function calcularScoreCompleto(maxSit, sinDeudas, periodos, chData, histData) {
  let puntos = 0;

  // 1. SITUACIÓN BCRA (Max 400)
  // Idéntico al admin: sit1=400, sit2=200, sit3=50, sit4+=0, null=200
  const pBCRA = maxSit === null ? 200 : maxSit === 1 ? 400 : maxSit === 2 ? 200 : maxSit === 3 ? 50 : 0;
  puntos += pBCRA;

  // 2. HISTORIAL 24M (Max 150)
  // Usa histData si disponible (endpoint /historial), sino los periodos del BCRA actual
  let pHistorial = 75; // neutral si no hay datos
  const periodosHist = histData?.results?.periodos?.length > 0
    ? histData.results.periodos
    : (periodos.length > 0 ? periodos : []);

  if (periodosHist.length > 0) {
    let mesesMalos = 0;
    periodosHist.slice(0, 24).forEach(p => {
      const sitMax = (p.entidades||[]).reduce((m,e) => Math.max(m, e.situacion||1), 1);
      if (sitMax > 1) mesesMalos++;
    });
    if (mesesMalos === 0)     { pHistorial = 150; }
    else if (mesesMalos <= 2) { pHistorial = 75; }
    else                      { pHistorial = 0; }
  } else if (sinDeudas) {
    pHistorial = 150;
  }
  puntos += pHistorial;

  // 3. CHEQUES RECHAZADOS (Max 150)
  // sin_deudas:true = confirmado sin cheques = 150. datos reales = calcular activos.
  let pCheques = 75; // neutral si no hay datos
  if (chData && chData.sin_deudas === true && !chData.error_bcra) {
    pCheques = 150;
  } else if (chData && !chData.error_bcra) {
    const resC = chData.results || chData;
    let todosDetalles = [];
    if (resC && resC.causales) {
      resC.causales.forEach(c => {
        (c.entidades||[]).forEach(e => {
          (e.detalle||[]).forEach(d => todosDetalles.push(d));
        });
      });
    }
    const total = todosDetalles.length;
    const activos = todosDetalles.filter(d => !d.fechaPago || d.estadoMulta === 'IMPAGA').length;
    if (total === 0)        pCheques = 150;
    else if (activos === 0) pCheques = 75;
    else                    pCheques = 0;
  }
  puntos += pCheques;

  // 4. DSO INDIVIDUAL (Max 100) — neutral en comercial
  puntos += 50;

  // 5. HISTORIAL PIATTELLI (Max 100) — neutral en comercial
  puntos += 50;

  // 6. RED DE BODEGAS (Max 60) — neutral en comercial
  puntos += 30;

  // 7. CONCENTRACIÓN DE DEUDA (Max 39)
  let pConc = 20; // neutral sin datos
  if (periodos.length > 0) {
    const ents = periodos[0].entidades || [];
    const nroEnt = ents.length;
    const montoM = ents.reduce((s,e) => s+(e.monto||0), 0) / 1000;
    if (nroEnt === 0)                      pConc = 39;
    else if (nroEnt === 1 && montoM < 50)  pConc = 35;
    else if (nroEnt <= 2 && montoM < 100)  pConc = 28;
    else if (nroEnt <= 3 && montoM < 500)  pConc = 20;
    else if (nroEnt <= 5 && montoM < 2000) pConc = 10;
    else                                   pConc = 0;
  } else if (sinDeudas) {
    pConc = 39;
  }
  puntos += pConc;

  // TECHOS DUROS (idénticos al admin)
  if (maxSit >= 4) puntos = Math.min(puntos, 250);
  else if (maxSit === 3) puntos = Math.min(puntos, 400);

  return Math.max(1, Math.min(999, Math.round(puntos)));
}

// ─── CRÉDITO SUGERIDO — HARD CAP $2.000.000 ──────────
function calcularCredito(s) {
  let monto;
  if (s >= 900) monto = [800000, 2000000];
  else if (s >= 700) monto = [500000, 800000];
  else if (s >= 500) monto = [200000, 500000];
  else if (s >= 400) monto = [100000, 200000];
  else if (s >= 300) monto = [0, 100000];
  else if (s >= 200) monto = null; // contado anticipado
  else return 'No recomendado';

  if (!monto) return 'Solo contado anticipado';

  // Hard cap: nunca superar CREDITO_MAX
  const min = monto[0], max = Math.min(monto[1], CREDITO_MAX);
  if (min >= max) return `Hasta $${fmtFull(max)}`;
  return `$${fmtFull(min)} – $${fmtFull(max)}`;
}

// ─── HELPERS ──────────────────────────────────────────
function scoreToColor(s){
  if(!s)return'var(--texto2)';
  if(s>=700)return'var(--verde)';
  if(s>=400)return'var(--amarillo)';
  if(s>=200)return'var(--naranja)';
  return'var(--rojo)';
}
function scoreToRango(s){
  if(!s)return'—';
  if(s>=800)return'Excelente';
  if(s>=600)return'Bueno';
  if(s>=400)return'Revisar';
  if(s>=200)return'Alto riesgo';
  return'Rechazar';
}
function sitBg(s){return{1:'#dcfce7',2:'#fef9c3',3:'#ffedd5',4:'#fee2e2',5:'#fee2e2',6:'#fee2e2'}[s]||'#dcfce7';}
function fmtM(n){if(!n)return'0';if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(0)+'K';return Math.round(n).toLocaleString('es-AR');}
function fmtFull(n){if(!n)return'0';return Math.round(n).toLocaleString('es-AR');}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

document.getElementById('inp-pin').addEventListener('keypress',e=>{if(e.key==='Enter')doLogin();});
