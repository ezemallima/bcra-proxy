async function consultarCuit() {
  const cuit = document.getElementById('cuit-input').value.trim().replace(/\D/g,'');
  if (cuit.length < 10) { alert('CUIT inválido'); return; }
  showLoading('Consultando BCRA…');
  document.getElementById('consulta-resultado').innerHTML = '';
  const resEl = document.getElementById('consulta-resultado');
  try {
    // ARCA en paralelo con BCRA — sin overhead extra de tiempo
    const [dd, cd, hd, serverScore, afipRaw] = await Promise.all([
      safeFetch(API + '/deudas/' + cuit),
      safeFetch(API + '/deudas/' + cuit + '/cheques'),
      safeFetch(API + '/deudas/' + cuit + '/historial'),
      safeFetch(API + '/fetch-score/' + cuit + '?fresh=1'),
      safeFetch(API + '/afip/' + cuit).catch(() => null),
    ]);
    hideLoading();
    if (!dd || dd._gateway_error) {
      resEl.innerHTML = `<div class="card" style="text-align:center;padding:20px">
        <div style="margin-bottom:8px"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
        <div style="font-weight:700;margin:8px 0">Servidor ocupado (502)</div>
        <div style="font-size:12px;color:var(--text2);margin-bottom:12px">Esperá unos segundos e intentá de nuevo.</div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button onclick="consultarCuit()" style="background:var(--azul);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg> Forzar Recálculo</button>
          <button onclick="document.getElementById('consulta-resultado').innerHTML='';document.getElementById('cuit-input').value='';document.getElementById('cuit-input').focus();" style="background:none;border:1.5px solid var(--border);border-radius:8px;padding:8px 18px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;font-family:'Inter',sans-serif">← Nuevo CUIT</button>
        </div>
      </div>`;
      return;
    }

    // Normalizar AFIP — null si falló o devolvió error de gateway
    const afipExtra = (afipRaw && !afipRaw._gateway_error) ? afipRaw : null;

    // Usar AFIP como fallback de denominacion si BCRA no la trajo
    if (!dd?.results?.denominacion?.trim() && afipExtra?.nombre && afipExtra.nombre !== cuit) {
      if (!dd.results) dd.results = {};
      dd.results.denominacion = afipExtra.nombre;
      console.log('[consulta] Razón social desde', afipExtra.fuente + ':', afipExtra.nombre);
    }

    // Anti-CUIT: frena si denominacion vacía, igual al CUIT, o solo dígitos (CUIT duplicado)
    const _nombreFinal = dd?.results?.denominacion?.trim() || '';
    if (!_nombreFinal || _nombreFinal === cuit || /^\d{10,11}$/.test(_nombreFinal)) {
      mostrarErrorCuitInexistente(cuit);
      return;
    }

    // Guardar estado para generarPDF()
    window._ultimaConsulta = { cuit, dd, cd: cd || {}, hd, serverScore };

    console.log('[consulta] score=', serverScore?.score, 'mt=', serverScore?.mora_tecnica,
                '| afip:', afipExtra ? (afipExtra.fuente || 'ok') : 'offline');
    renderConsulta(cuit, dd, cd || {}, hd, serverScore, afipExtra);
    lanzarAnalisisIA(cuit, dd, cd || {});
  } catch(e) {
    hideLoading();
    resEl.innerHTML = '<div class="card"><div style="color:var(--red)">Error consultando BCRA. Intentá de nuevo.</div></div>';
  }
}

function veredictoRapido(score, activosCheques, maxSit) {
  const svgX    = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>';
  const svgWarn = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
  const svgChk  = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><polyline points="20 6 9 17 4 12"/></svg>';
  const svgEye  = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  if (maxSit >= 4 || activosCheques > 0)
    return {texto: svgX    + ' No operar a crédito',      subtexto: activosCheques > 0 ? 'Cheques impagos activos registrados en BCRA' : 'Situación de mora grave (Sit. 4–5)',                    bg:'rgba(239,68,68,0.08)',   color:'#991b1b', borde:'rgba(239,68,68,0.3)'};
  if (maxSit === 3 || score < 300)
    return {texto: svgWarn + ' Crédito denegado',         subtexto: maxSit === 3 ? 'Situación irregular en el sistema financiero (Sit. 3)' : 'Score insuficiente para operar a crédito',           bg:'rgba(245,158,11,0.08)', color:'#92400e', borde:'rgba(245,158,11,0.3)'};
  if (score >= 700 && maxSit === 1)
    return {texto: svgChk  + ' Crédito recomendado',      subtexto: 'Perfil de riesgo bajo — historial bancario sin observaciones',                                                                  bg:'rgba(16,185,129,0.12)', color:'#14532d', borde:'rgba(16,185,129,0.4)'};
  if (score >= 600)
    return {texto: svgChk  + ' Crédito aprobado',         subtexto: 'Historial crediticio dentro de parámetros aceptables',                                                                         bg:'rgba(16,185,129,0.08)', color:'#166534', borde:'rgba(16,185,129,0.3)'};
  return   {texto: svgEye  + ' Revisar antes de vender',  subtexto: 'Score moderado — evaluar con límite de crédito reducido',                                                                       bg:'rgba(249,115,22,0.08)', color:'#9a3412', borde:'rgba(249,115,22,0.3)'};
}

function renderConsulta(cuit, dd, cd, hd, serverScore, afipData) {
  const results = dd.results||{}, periodos = results.periodos||[];
  let maxSit=1, entidades=[], montoTotal=0;
  if (periodos.length) {
    entidades = periodos[0].entidades||[];
    if (entidades.length) {
      maxSit    = maxSitMaterial(entidades); // Regla de Materialidad: ignora montos < $50.000
      montoTotal = entidades.reduce((s,e)=>s+(e.monto||0),0);
    }
  }
  const _cuitConsulta = cuit;
  const _scoreMap = window._scoresCartera || {};
  // SSoT: servidor es la única fuente de verdad — sin recálculo JS
  const scoreEst = serverScore?.score ?? (_scoreMap[_cuitConsulta]?.scoreCompleto) ?? null;
  window._ultimoScoreComercial = scoreEst;
  // Mora técnica: color del círculo siempre naranja aunque maxSit sea alto
  const cc = (serverScore?.mora_tecnica) ? '#ca8a04' : scoreToColor(scoreEst);
  const _alertaCritica = scoreEst !== null && scoreEst <= 50;

  // Cheques
  const causales = cd.results?.causales||[]; let dchq=[];
  causales.forEach(ca=>ca.entidades?.forEach(en=>dchq.push(...(en.detalle||[]))));
  const activos = dchq.filter(d=>!d.fechaPago||d.estadoMulta==='IMPAGA');
  const montoImpagos = activos.reduce((s,d)=>s+(d.monto||0),0);
  let verd = veredictoRapido(scoreEst, activos.length, maxSit);
  if (serverScore?.mora_tecnica) {
    // Mora técnica pisa cualquier veredicto basado en maxSit puro
    verd = {
      texto:    '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Revisar — mora técnica por monto menor',
      subtexto: 'Deuda de monto menor que no compromete la solvencia general',
      bg:       'rgba(245,158,11,0.10)',
      color:    '#fde68a',
      borde:    'rgba(245,158,11,0.4)',
    };
  }

  let html = `<div class="card" style="padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px">
    <div style="min-width:0">
      <div id="consulta-nombre" style="font-size:15px;font-weight:700;color:var(--azul);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(results.denominacion||'Sin nombre')}</div>
      <div style="font-size:11px;color:var(--texto2);font-family:monospace">${cuit}</div>
    </div>
    <button onclick="generarPDF('${cuit}')" style="flex-shrink:0;background:var(--azul);color:#fff;border:none;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> PDF</button>
  </div>`;

  // ── 1. VEREDICTO RÁPIDO — decisión en 10 segundos ──
  const _ingAnual  = serverScore?.inferencia_ingresos;
  const _fuenteIng = serverScore?.fuente_ingresos || '';
  const _activ     = serverScore?.actividad_principal || '';
  const _esBcraFallback = _fuenteIng === 'bcra_inferido' || _fuenteIng === 'bcra_fallback';
  const _ingValido = _ingAnual && _ingAnual > 0 && !_esBcraFallback;
  const ingStr     = _ingValido ? fmtM(_ingAnual) : 'Sin datos verificados';
  const ingColor   = _ingValido ? 'var(--azul)' : 'var(--texto2)';
  const ingSize    = _ingValido ? '14px' : '11px';

  const _overrideAdmin = serverScore?.override_admin === true;
  const _overrideNota  = serverScore?.override_nota  || null;
  const _moraTecnica   = serverScore?.mora_tecnica === true;
  const _pctMora       = serverScore?.pct_mora ?? null;
  const _notaServidor  = serverScore?.nota_mora_tecnica || null;
  const _limDin        = serverScore?.limite_dinamico_sugerido ?? null;

  let overrideAdminHtml = '';
  if (_overrideAdmin) {
    const notaOv = _overrideNota || 'Situación Regularizada (Validación Interna)';
    overrideAdminHtml = `<div style="margin-top:8px;background:rgba(16,185,129,0.1);border:2px solid rgba(16,185,129,0.35);border-radius:8px;padding:10px 14px;font-size:12px;color:#166534;text-align:left">
      <div style="font-weight:700;font-size:13px;margin-bottom:4px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><polyline points="20 6 9 17 4 12"/></svg> ${esc(notaOv)}</div>
      <div style="color:#14532d">Score calculado por validación interna. Situaciones bancarias de entidades menores no aplican penalización.</div>
    </div>`;
  }

  // Badge de deuda excluida (misma lógica de backend que en app admin — solo difiere el render)
  const _fdExclCom = serverScore?.falsas_deudas?.excluidas || [];
  const _fdRazCom  = serverScore?.falsas_deudas?.razones   || {};
  let falsaDeudaHtml = '';
  if (_fdExclCom.length > 0) {
    const _fdItems = _fdExclCom.map(e => {
      const r = _fdRazCom[e] || {};
      return `${esc(e)}: $${fmtM(r.monto||0)} Sit.${r.sit||'?'}`;
    }).join(' · ');
    falsaDeudaHtml = `<div style="margin-top:8px;background:rgba(14,165,233,0.08);border:1px solid rgba(14,165,233,0.3);border-radius:6px;padding:8px 12px;font-size:12px;color:#0369a1;text-align:left">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <strong>Deuda excluida del análisis:</strong> ${_fdItems}
    </div>`;
  }

  let moraTecHtml      = '';
  if (_moraTecnica && !_overrideAdmin) {
    const notaTxt = _notaServidor
      || (() => {
           const moraK    = (_pctMora != null && montoTotal > 0) ? Math.round(_pctMora * montoTotal) : 0;
           const pctBuena = _pctMora != null ? Math.round((1 - _pctMora) * 100) : null;
           const moraStr  = moraK > 0 ? ` Deuda en mora: $${fmtM(moraK * 1000)} en Sit.${maxSit}.` : '';
           const buenaStr = pctBuena != null ? ` ${pctBuena}% de la cartera en situación normal.` : '';
           return `Atención: Se detecta una mora técnica por monto menor que no afecta la solvencia general.${moraStr}${buenaStr}`;
         })();
    moraTecHtml = `<div style="margin-top:8px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);border-radius:6px;padding:8px 12px;font-size:12px;color:#92400e;text-align:left">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> ${esc(notaTxt)}
    </div>`;
  }

  // Banner BCRA no disponible
  const _bcraDisp = serverScore?.bcra_disponible !== false;
  const bcraNoDis = !_bcraDisp
    ? `<div style="margin-bottom:10px;background:rgba(234,179,8,0.1);border:2px solid rgba(234,179,8,0.4);border-radius:8px;padding:10px 14px;font-size:12px;color:#78350f;text-align:left">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <strong>Historial crediticio del BCRA temporalmente no disponible por caída del servidor oficial.</strong> Reintente en unos minutos. No se otorguen créditos basados en este informe parcial.
      </div>`
    : '';

  // Badge Deuda +90 días (penalización score interno)
  const _deuda90d   = serverScore?.deuda_90d_interna === true;
  const _monto90d   = serverScore?.monto_deuda_90d ?? null;
  let deuda90dHtml  = '';
  if (_deuda90d) {
    const montoStr  = (_monto90d && _monto90d > 0) ? ` — $${fmtM(_monto90d)} pendiente` : '';
    deuda90dHtml    = `<div style="margin-top:8px;background:rgba(239,68,68,0.08);border:2px solid rgba(239,68,68,0.3);border-radius:8px;padding:10px 14px;font-size:12px;color:#991b1b;text-align:left">
      <div style="font-weight:700;font-size:13px;margin-bottom:4px"><svg width="10" height="10" viewBox="0 0 10 10" fill="#ef4444" style="vertical-align:-1px"><circle cx="5" cy="5" r="5"/></svg> DEUDA INTERNA +90 DÍAS${montoStr}</div>
      <div style="color:#7f1d1d">Este cliente tiene facturas propias vencidas hace más de 90 días. <strong>Score penalizado −200 pts.</strong></div>
    </div>`;
  }

  const _rangoDisplay = `<span style="color:${cc}">${scoreToRango(scoreEst)}</span>`;

  html += bcraNoDis;
  html += `<div style="background:${verd.bg};border:2px solid ${verd.borde};border-radius:var(--radius);padding:16px;margin-bottom:10px;text-align:center">
    <div style="font-size:20px;font-weight:800;color:${verd.color};font-family:'Syne',sans-serif">${verd.texto}</div>
    ${verd.subtexto ? `<div style="font-size:11px;font-weight:500;color:${verd.color};opacity:0.7;margin-top:3px;letter-spacing:0.2px">${verd.subtexto}</div>` : ''}
    ${overrideAdminHtml}${_overrideAdmin ? '' : moraTecHtml}${falsaDeudaHtml}${deuda90dHtml}
    <div style="display:flex;justify-content:center;gap:20px;margin-top:10px;flex-wrap:wrap">
      <div style="text-align:center">
        <div style="font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:3px">Score Vende Seguro</div>
        <div style="font-size:28px;font-weight:800;color:${_alertaCritica?'#dc2626':cc};font-family:'Syne',sans-serif;${_alertaCritica?'text-shadow:0 0 12px rgba(220,38,38,0.25);':''}">${scoreEst}</div>
        <div style="font-size:12px;margin-top:2px">${_rangoDisplay}</div>
        ${_alertaCritica?'<div style="font-size:11px;font-weight:700;color:#991b1b;margin-top:4px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);border-radius:6px;padding:3px 8px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Alerta Crediticia Crítica</div>':''}
      </div>
      <div style="text-align:center">
        <div style="font-size:28px;font-weight:800;color:${activos.length>0?'var(--rojo)':'var(--verde)'};font-family:'Syne',sans-serif">${activos.length}</div>
        <div style="font-size:10px;color:var(--texto2)">Cheques impagos</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:18px;font-weight:700;color:var(--azul);font-family:'Syne',sans-serif">${calcularCredito(scoreEst, maxSit)}</div>
        <div style="font-size:10px;color:var(--texto2)">Crédito sugerido</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:${ingSize};font-weight:700;color:${ingColor};font-family:'Syne',sans-serif">${ingStr}</div>
        <div style="font-size:10px;color:var(--texto2)">Ingresos estimados</div>
      </div>
    </div>
    <div style="margin-top:10px">
      <button onclick="forzarRecalculo('${cuit}', this)"
        style="font-size:11px;background:none;border:1px solid var(--border);color:var(--texto2);border-radius:6px;padding:4px 12px;cursor:pointer">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg> Forzar recálculo profundo
      </button>
    </div>
  </div>`;

  // ── 2. CHEQUES — prioridad visual ──
  html += `<div class="card"><div class="card-title">Cheques rechazados BCRA</div>`;
  if (!dchq.length) {
    html += `<div style="color:var(--verde);font-size:14px;font-weight:600;padding:8px 0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><polyline points="20 6 9 17 4 12"/></svg> Sin cheques rechazados</div>`;
  } else {
    html += `<div style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap">
      <div style="flex:1;background:${activos.length>0?'var(--rojo-bg)':'var(--verde-bg)'};border-radius:8px;padding:10px;text-align:center;min-width:80px">
        <div style="font-size:22px;font-weight:800;color:${activos.length>0?'var(--rojo)':'var(--verde)'}">${activos.length}</div>
        <div style="font-size:10px;color:var(--texto2)">Impagos</div>
      </div>
      <div style="flex:1;background:var(--verde-bg);border-radius:8px;padding:10px;text-align:center;min-width:80px">
        <div style="font-size:22px;font-weight:800;color:var(--verde)">${dchq.length-activos.length}</div>
        <div style="font-size:10px;color:var(--texto2)">Regularizados</div>
      </div>
      ${montoImpagos>0?`<div style="flex:1;background:var(--rojo-bg);border-radius:8px;padding:10px;text-align:center;min-width:80px">
        <div style="font-size:16px;font-weight:800;color:var(--rojo)">$${fmtM(montoImpagos)}</div>
        <div style="font-size:10px;color:var(--texto2)">Monto impago</div>
      </div>`:''}
    </div>`;
    dchq.slice(0,8).forEach(d=>{
      const imp = !d.fechaPago||d.estadoMulta==='IMPAGA';
      const fechaCheque  = d.fechaRechazo || d.fecha || '—';
      const causalCheque = esc(d.causal||d.motivo||'');
      html += `<div class="cheque-item" style="${imp?'border-left:3px solid var(--rojo)':''}">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:2px">
            <span style="font-weight:700;font-size:14px">$${fmtM(d.monto||0)}</span>
            <span style="font-size:12px;font-weight:600;color:${imp?'#dc2626':'#475569'};font-family:'Roboto Mono',monospace">${fechaCheque}</span>
          </div>
          <div style="font-size:10px;color:var(--texto2)">${esc(d.nroCheque||'')}${causalCheque?' · '+causalCheque:''}</div>
        </div>
        <span class="cheque-estado ${imp?'impago':'pagado'}">${imp?'IMPAGO':'PAGADO'}</span>
      </div>`;
    });
    if (dchq.length>8) html+=`<div style="font-size:11px;color:var(--texto2);text-align:center;margin-top:6px">+${dchq.length-8} más</div>`;

    // Gráfico de barras: evolución mensual de cheques rechazados (últimos 12 meses)
    const _chqMeses = {};
    dchq.forEach(d => {
      const parts = (d.fechaRechazo||'').split('/');
      if (parts.length >= 3) {
        const key = parts[2] + '-' + String(parts[1]).padStart(2,'0');
        if (!_chqMeses[key]) _chqMeses[key] = { total:0, impagos:0 };
        _chqMeses[key].total++;
        if (!d.fechaPago || d.estadoMulta==='IMPAGA') _chqMeses[key].impagos++;
      }
    });
    const _mesKeys = Object.keys(_chqMeses).sort().slice(-12);
    if (_mesKeys.length > 1) {
      const _maxBar = Math.max(..._mesKeys.map(m => _chqMeses[m].total), 1);
      html += `<div style="margin-top:14px;border-top:1px solid var(--border);padding-top:10px">
        <div style="font-size:10px;font-weight:600;color:var(--texto2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Evolución mensual</div>
        <div style="display:flex;align-items:flex-end;gap:3px;height:56px">`;
      _mesKeys.forEach(m => {
        const d2 = _chqMeses[m];
        const barH = Math.max(Math.round((d2.total/_maxBar)*46), 4);
        const col  = d2.impagos > 0 ? '#ef4444' : '#86efac';
        const lbl  = m.slice(5) + '/' + m.slice(2,4);
        html += `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:1px" title="${lbl}: ${d2.total} cheques${d2.impagos>0?' ('+d2.impagos+' imp.)':''}">
          <div style="width:100%;max-width:22px;height:${barH}px;background:${col};border-radius:2px 2px 0 0"></div>
          <div style="font-size:7px;color:var(--texto2);writing-mode:vertical-lr;transform:rotate(180deg);line-height:1">${lbl}</div>
        </div>`;
      });
      html += `</div></div>`;
    }
  }
  html += `</div>`;

  // ── 3. SITUACIÓN BCRA ──
  if (dd.error_bcra) {
    html += `<div class="card"><div style="color:var(--texto2);font-size:13px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> No se pudo obtener info del BCRA.</div></div>`;
  } else if (dd.sin_deudas||!entidades.length) {
    html += `<div class="card"><div class="card-title">Situación BCRA</div><div class="sit-grid">
    <div class="sit-chip"><span class="sit-chip-label">Situación</span><span class="sit-chip-val sit-1">1 — Normal</span></div>
    <div class="sit-chip"><span class="sit-chip-label">Deuda sistema</span><span class="sit-chip-val">Sin deudas</span></div></div></div>`;
  } else {
    html += `<div class="card"><div class="card-title">Situación BCRA — ${periodos[0]?.periodo||''}</div><div class="sit-grid">
    <div class="sit-chip"><span class="sit-chip-label">Peor sit.</span><span class="sit-chip-val sit-${maxSit}">Sit. ${maxSit}</span></div>

async function lanzarAnalisisIA(cuit, dd, cd) {
  // ── Datos BCRA básicos ──────────────────────────────────────────────────────
  const results = dd.results || {}, periodos = results.periodos || [];
  let maxSit = 1, montoTotal = 0, entidades = [];
  if (periodos.length) {
    entidades = periodos[0].entidades || [];
    if (entidades.length) {
      // maxSit RAW (sin filtrar) → se pasa completo a la IA para que evalúe el riesgo real
      maxSit     = Math.max(...entidades.map(e => e.situacion || 1));
      montoTotal = entidades.reduce((s, e) => s + (e.monto || 0), 0);
    }
  }
  // maxSitEfectivo (con Regla de Materialidad) → solo para estimarScore() fallback local
  const maxSitEfectivo = maxSitMaterial(entidades);
  const causales = cd.results?.causales || [];
  let chqTotal = 0;
  causales.forEach(ca => ca.entidades?.forEach(en => { chqTotal += (en.detalle || []).length; }));

  // ── Score: preferir serverScore completo (tiene .detalle[]) ────────────────
  // window._ultimoScoreComercial = número puro; el objeto completo está en _ultimaConsulta
  const _uc      = window._ultimaConsulta;
  const scoreObj = (_uc && _uc.serverScore && _uc.serverScore.score != null) ? _uc.serverScore : null;
  // estimarScore usa maxSitEfectivo (material) para no degradar el fallback por peajes
  const scoreNum = scoreObj?.score ?? window._ultimoScoreComercial ?? estimarScore(maxSitEfectivo, dd.sin_deudas, cd);

  // Named-label lookup — NUNCA índices posicionales
  function _dv(label) {
    if (!scoreObj || !Array.isArray(scoreObj.detalle)) return 'N/D';
    const item = scoreObj.detalle.find(d => d.label === label);
    return item ? item.valor : 'N/D';
  }
  const dSituacion = _dv('Situación BCRA');
  const dHistorial = _dv('Historial BCRA 24m');
  const dCheques   = _dv('Cheques rechazados');
  const dDSO       = _dv('DSO individual');
  const dPiattelli = _dv('Historial Piattelli');
  const dBodegas   = _dv('Red de Bodegas');
  const dConc      = _dv('Concentración deuda BCRA');

  // Deuda total en texto legible (montoTotal está en miles de pesos)
  const deudaMillones = montoTotal > 0 ? (montoTotal / 1000).toFixed(1) : null;
  const deudaLabel    = montoTotal > 0
    ? montoTotal.toLocaleString('es-AR') + ' miles' + (deudaMillones ? ' ≈ ' + deudaMillones + 'M' : '')
    : 'Sin deuda registrada en BCRA';

  // ── Mora interna con Piattelli (CARTERA_LOCAL) ─────────────────────────────
  const _ncFn = x => String(x || '').replace(/\D/g, '').trim();
  const clienteLocalIA    = CARTERA_LOCAL.find(c => _ncFn(c.cuit) === _ncFn(cuit));
  const tieneMoraInterna  = (clienteLocalIA?.total_saldo || 0) > 0;

  // ── datosHistorial: mora + perfil Piattelli + bodegas ─────────────────────
  let datosHistorial = '';
  if (tieneMoraInterna) {
    datosHistorial += '⚠ MORA INTERNA ACTIVA CON BODEGA PIATTELLI: $'
      + fmtFull(clienteLocalIA.total_saldo) + ' pendiente de cobro.\n';
  }
  if (dPiattelli && dPiattelli !== 'N/D') datosHistorial += 'Historial Piattelli: ' + dPiattelli + '\n';
  if (dBodegas   && dBodegas   !== 'N/D') datosHistorial += 'Red de Bodegas: '      + dBodegas   + '\n';
  if (!datosHistorial) datosHistorial = 'Sin historial comercial registrado con Bodega Piattelli.';

  const scoreLabel = scoreObj
    ? scoreNum + '/999 — ' + (scoreObj.rango || scoreToRango(scoreNum))
    : (scoreNum != null ? scoreNum + '/999 — ' + scoreToRango(scoreNum) : 'N/D');

  // ── Prompt corporativo (idéntico criterio al de index.html) ───────────────
  const prompt =
`Sos un Gerente Senior de Riesgo Crediticio Corporativo de un banco de primera línea argentino, contratado por Bodega Piattelli para evaluar sus clientes distribuidores con criterio bancario estricto.

═══ SCORE VENDE SEGURO ═══
Score: ${scoreLabel}
Situación BCRA actual: ${dSituacion}
Historial BCRA 24m: ${dHistorial}
Cheques rechazados: ${dCheques}
DSO individual: ${dDSO}
Historial Piattelli: ${dPiattelli}
Red de Bodegas: ${dBodegas}
Concentración deuda BCRA: ${dConc}
Deuda total sistema financiero: ${deudaLabel}
Peor situación BCRA: ${maxSit} | Entidades involucradas: ${entidades.length} | Cheques rechazados totales: ${chqTotal}

═══ HISTORIAL COMERCIAL (PIATTELLI) ═══
${datosHistorial}

═══ INSTRUCCIONES ═══
1. Dictamen 3-4 oraciones. Español directo, sin markdown.
2. ESCALA DEL CLIENTE: Si la deuda total BCRA supera $50 millones en Situación 1, el crédito sugerido NO puede ser un rango de microempresa. Calculá entre 5% y 10% de su deuda mensual normalizada (puede ser $10M-$50M+ según el caso).
3. Clientes pequeños/medianos o sin historial masivo → criterio tradicional riguroso basado en Score, historial de mora interna y Situación BCRA.
4. Mora interna activa con Bodega Piattelli = PRIORIDAD ABSOLUTA → límite de crédito DEBE ser $0, priorizando el resguardo de la caja.
5. SIEMPRE terminar con: "Límite de crédito sugerido: [monto exacto calculado]"`;

  try {
    const resp = await fetch(API + '/analizar', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ prompt })
    });
    const data = await resp.json();
    const iaEl = document.getElementById('ia-texto'), loadEl = document.getElementById('ia-loading');
    if (iaEl && loadEl) {
      loadEl.style.display = 'none';
      iaEl.style.display   = 'block';
      iaEl.textContent     = data.texto || 'No se pudo generar el análisis.';
      if (!data.texto) iaEl.style.color = 'var(--text2)';
    }
  } catch(e) {
    const l = document.getElementById('ia-loading');
    if (l) l.innerHTML = '<span style="color:var(--text2);font-size:12px">Error generando análisis</span>';
  }
}

// ── safeFetch: sin retry en 502, detecta HTML, devuelve JSON o null ──────────
async function safeFetch(url, { retries = 1, timeoutMs = 15000 } = {}) {
  for (let i = 0; i <= retries; i++) {
    let r;
    try {
      r = await fetch(url, { signal: AbortSignal.timeout(timeoutMs) });
    } catch (e) {
      if (i < retries) { await new Promise(res => setTimeout(res, 2000)); continue; }
      console.warn('[safeFetch] red:', url, e?.message);
      return null;
    }
    if (r.status === 502 || r.status === 503 || r.status === 504) {
      console.warn('[safeFetch] gateway', r.status, url);
      return { _gateway_error: true, _status: r.status };   // sin retry
    }
    if (!r.ok) return null;
    let text;
    try { text = await r.text(); } catch(e) { return null; }
    if (text.trimStart().startsWith('<')) {
      console.warn('[safeFetch] HTML error page:', url);
      return { _gateway_error: true, _status: r.status };
    }
    try { return JSON.parse(text); } catch(e) { return null; }
  }
  return null;
}

function parseFecha(s) {
  if (!s) return new Date(9999,0,1);
  if (s.includes('/')) { const [d,m,y]=s.split('/'); return new Date(parseInt(y),parseInt(m)-1,parseInt(d)); }
  return new Date(s);
}

// Días de atraso máximo sobre facturas abiertas de un cliente.
// Devuelve: null=sin facturas, 0=todas vigentes, N>0=días vencidas la más antigua.
function calcDSO(saldosData) {
  if (!saldosData || !saldosData.facturas || !saldosData.facturas.length) return null;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  let maxAtraso = 0;
  saldosData.facturas.forEach(function(f) {
    if (!(f.saldo > 0)) return;
    const venc = parseFecha(f.fechaPago);
    const atraso = Math.round((hoy - venc) / 86400000); // positivo = vencida
    if (atraso > maxAtraso) maxAtraso = atraso;
  });
  return maxAtraso;
}

// Score completo sincrónico (con datos ya cargados) — espeja calcular_score_servidor
function calcularScoreCompletoSync(maxSit, sinDeudas, periodos, chData, histData) {
  let pts = 0;
  let penaltyArrastre = false;
  const entidades = periodos.length ? (periodos[0].entidades||[]) : [];
  const nroEnt = entidades.length;
  // montoM en millones (para concentración), montoMiles en miles (para sit1)
  const montoMiles = entidades.reduce((s,e) => s+(e.monto||0), 0);
  const montoM = montoMiles / 1000;

  // Periodos activos — usar historial 24m si está disponible
  const periodosParaNPH = histData?.results?.periodos?.length > 0
    ? histData.results.periodos
    : periodos;
  let nPH = 0, nPR = 0;
  periodosParaNPH.slice(0,24).forEach((p,i) => {
    if ((p.entidades||[]).some(e => (e.monto||0) > 0)) {
      nPH++; if (i < 6) nPR++;
    }
  });
  nPH = Math.min(nPH, nPR * 4);

  // 1. Situación BCRA ponderada — idéntica a calcular_score_servidor
  let pSit;
  if (maxSit === 1) {
    if      (montoMiles === 0)      pSit = 200; // sin historial bancario
    else if (montoMiles < 500000)   pSit = 250; // perfil pequeño
    else if (montoMiles < 2500000)  pSit = 300; // perfil moderado
    else if (nPH >= 12)             pSit = 400; // perfil consolidado
    else if (nPH >= 6)              pSit = 350;
    else if (nPH >= 2)              pSit = 300;
    else                            pSit = 250;
  } else if (maxSit === 2) pSit = 200;
  else if (maxSit === 3)   pSit = 50;
  else                     pSit = 0;
  pts += pSit;

  // 2. Historial 24m
  let pHist = 75;
  if (histData) {
    const pH = (histData.results||{}).periodos||[];
    // Regla 6 meses: sit≥3 en cualquiera → pHist=0 automático
    const sitGrave6m = pH.slice(0,6).some(p =>
      Math.max(...(p.entidades||[]).map(e=>e.situacion||1), 1) >= 3
    );
    if (sitGrave6m) {
      pHist = 0;
    } else {
      const malos = pH.slice(0,24).filter(p =>
        Math.max(...(p.entidades||[]).map(e=>e.situacion||1),1) > 1
      ).length;
      penaltyArrastre = (malos >= 2 && malos <= 5);
      if (malos > 5) pHist = 0;
      else if (malos > 0) pHist = malos<=2 ? 75 : 0;
      else pHist = nPH>=12 ? 150 : nPH>=3 ? 90 : nPH>=1 ? 40 : 60;
    }
  } else if (sinDeudas) { pHist = 60; }
  pts += pHist;

  // 3. Cheques
  let pCheq = 75;
  if (chData) {
    const causales = chData.results?.causales||[];
    let det=[]; causales.forEach(ca=>ca.entidades?.forEach(en=>det.push(...(en.detalle||[]))));
    const act = det.filter(d=>!d.fechaPago||d.estadoMulta==='IMPAGA');
    if (act.length > 5 || det.length >= 113) return 1;
    if (chData.sin_deudas||!det.length) pCheq = nPH>6?150:nPH>=1?70:40;
    else if (!act.length) pCheq=75;
    else pCheq=0;
  }
  // Riesgo cruzado: sit cap en cheques
  if (maxSit >= 3)                  pCheq = 0;
  else if (maxSit >= 2 && pCheq > 75) pCheq = 75;
  pts += pCheq;

  pts += 50; // mora neutral (comercial no tiene acceso)
  pts += 50; // DSO neutral
  pts += 30; // bodegas neutral

  // Concentración — montoM ya está en millones
  let pConc;
  if (!nroEnt||sinDeudas)          pConc=39;
  else if (nroEnt===1&&montoM<50)  pConc=35;
  else if (nroEnt<=2&&montoM<100)  pConc=28;
  else if (nroEnt<=3&&montoM<500)  pConc=20;
  else if (nroEnt<=5&&montoM<2000) pConc=10;
  else                             pConc=0;
  pts += pConc;

  // Penalidad arrastre → -25% global antes de techos
  if (penaltyArrastre) pts = Math.round(pts * 0.75);

  // Techos duros — idénticos al servidor
  if      (maxSit >= 5) pts = Math.min(pts, 1);
  else if (maxSit >= 4) pts = Math.min(pts, 250);
  else if (maxSit === 3) pts = Math.min(pts, 400);

  return Math.max(1, Math.min(999, Math.round(pts)));
}

// ── REGLA DE MATERIALIDAD ─────────────────────────────────────────────────────
// Idéntica a index.html — excluye registros residuales del cálculo de maxSit.
// Umbral: max($50.000 = 50 miles BCRA, 0.01% del volumen total del cliente).
// Un peaje de $335 (0.335 miles) no puede disparar una alerta de insolvencia.
// Las entidades crudas siguen enviándose completas a la IA para análisis real.
function maxSitMaterial(entidades) {
  if (!entidades || !entidades.length) return 1;
  const totalMonto = entidades.reduce((s, e) => s + (e.monto || 0), 0);
  const umbral = Math.max(50, totalMonto * 0.0001); // 50 miles = $50.000
  const materiales = entidades.filter(e => (e.monto || 0) >= umbral);
  if (!materiales.length) return 1; // todos residuales → Sit. 1
  return materiales.reduce((m, e) => Math.max(m, e.situacion || 1), 1);
}

function estimarScore(maxSit,sinDeudas,chData) {
  // Cálculo local simplificado — solo se usa como fallback
  // El score real viene del servidor via calcularScoreCompleto()
  let pts=0;
  if(sinDeudas||maxSit===1)pts+=400;else if(maxSit===2)pts+=200;else if(maxSit===3)pts+=50;
  pts+=75;
  const causales=chData?.results?.causales||[];let detalles=[];
  causales.forEach(ca=>ca.entidades?.forEach(en=>detalles.push(...(en.detalle||[]))));
  const activos=detalles.filter(d=>!d.fechaPago||d.estadoMulta==='IMPAGA');
  if(!detalles.length)pts+=150;else if(!activos.length)pts+=75;
  pts+=50;pts+=50;pts+=30;pts+=39;
  if(maxSit>=4)pts=Math.min(pts,250);else if(maxSit===3)pts=Math.min(pts,400);
  return Math.max(1,Math.min(999,Math.round(pts)));
}

// Score completo via servidor — igual que la app principal
async function calcularScoreCompleto(cuit) {
  try {
    // AbortSignal.timeout(8s): evita que fetch() bloquee indefinidamente si el servidor no responde
    const [deudasR, histR, chequesR] = await Promise.all([
      fetch(API + '/deudas/' + cuit,               { signal: AbortSignal.timeout(8000) }).catch(() => null),
      fetch(API + '/deudas/' + cuit + '/historial', { signal: AbortSignal.timeout(8000) }).catch(() => null),
      fetch(API + '/deudas/' + cuit + '/cheques',   { signal: AbortSignal.timeout(8000) }).catch(() => null)
    ]);
    const bcraData  = deudasR  && deudasR.ok  ? await deudasR.json()   : null;
    const histData  = histR    && histR.ok    ? await histR.json()      : null;
    const chData    = chequesR && chequesR.ok ? await chequesR.json()   : null;
    if (!bcraData) return null;

    const results  = bcraData.results || {};
    const periodos = results.periodos || [];
    const sinDeudas = bcraData.sin_deudas;
    let maxSit = 1, entidades = [], montoTotal = 0, nroEnt = 0;
    if (periodos.length) {
      entidades = periodos[0].entidades || [];
      nroEnt = entidades.length;
      if (entidades.length) {
        maxSit    = maxSitMaterial(entidades); // Regla de Materialidad
        montoTotal = entidades.reduce((s,e) => s+(e.monto||0), 0) / 1000;
      }
    } else if (sinDeudas) { maxSit = 1; }

    // Periodos activos (con monto > 0)
    let nPH = 0, nPR = 0;
    periodos.slice(0,24).forEach((p,i) => {
      if ((p.entidades||[]).some(e => (e.monto||0) > 0)) {
        nPH++;
        if (i < 6) nPR++;
      }
    });
    nPH = Math.min(nPH, nPR * 4);

    // 1. Situacion BCRA ponderada
    let pSit;
    if      (maxSit === 1 && nPH >= 12) pSit = 400;
    else if (maxSit === 1 && nPH >= 6)  pSit = 300;
    else if (maxSit === 1 && nPH >= 2)  pSit = 200;
    else if (maxSit === 1)              pSit = 150;
    else if (maxSit === 2)              pSit = 200;
    else if (maxSit === 3)              pSit = 50;
    else                                pSit = 0;

    // 2. Historial 24m
    let pHist = 75;
    if (histData) {
      const pH = (histData.results||{}).periodos || [];
      const malosMeses = pH.slice(0,24).filter(p =>
        Math.max(...(p.entidades||[]).map(e => e.situacion||1), 1) > 1
      ).length;
      if (malosMeses > 0) {
        pHist = malosMeses <= 2 ? 75 : 0;
      } else {
        pHist = nPH >= 12 ? 150 : nPH >= 3 ? 90 : nPH >= 1 ? 40 : 60;
      }
    } else if (sinDeudas) { pHist = 60; }

    // 3. Cheques
    let pCheq = 75;
    if (chData) {
      const causales = chData.results?.causales || [];
      let detalles = [];
      causales.forEach(ca => ca.entidades?.forEach(en => detalles.push(...(en.detalle||[]))));
      const activos = detalles.filter(d => !d.fechaPago || d.estadoMulta === 'IMPAGA');
      if (chData.sin_deudas || !detalles.length) {
        pCheq = nPH > 6 ? 150 : nPH >= 1 ? 70 : 40;
      } else if (!activos.length) { pCheq = 75; }
      else { pCheq = 0; }
    }

    // 4. Mora (no disponible en comercial = neutral)
    const pMora = 50;

    // 5. DSO neutral
    const pDSO = 50;

    // 6. Red bodegas neutral
    const pBodegas = 30;

    // 7. Concentracion
    let pConc;
    if (!nroEnt || sinDeudas)                    pConc = 39;
    else if (nroEnt === 1 && montoTotal < 50)    pConc = 35;
    else if (nroEnt <= 2 && montoTotal < 100)    pConc = 28;
    else if (nroEnt <= 3 && montoTotal < 500)    pConc = 20;
    else if (nroEnt <= 5 && montoTotal < 2000)   pConc = 10;
    else                                          pConc = 0;

    let pts = pSit + pHist + pCheq + pMora + pDSO + pBodegas + pConc;
    // Techos duros — idénticos al servidor
    if      (maxSit >= 5) pts = Math.min(pts, 1);
    else if (maxSit >= 4) pts = Math.min(pts, 250);
    else if (maxSit === 3) pts = Math.min(pts, 400);

    const score = Math.max(1, Math.min(999, Math.round(pts)));
    return {
      score,
      rango: scoreToRango(score),
      color: scoreToColor(score),
      emoji: score>=700?'<svg width="10" height="10" viewBox="0 0 10 10" fill="#10b981" style="vertical-align:-1px"><circle cx="5" cy="5" r="5"/></svg>':score>=400?'<svg width="10" height="10" viewBox="0 0 10 10" fill="#f59e0b" style="vertical-align:-1px"><circle cx="5" cy="5" r="5"/></svg>':score>=200?'<svg width="10" height="10" viewBox="0 0 10 10" fill="#f59e0b" style="vertical-align:-1px"><circle cx="5" cy="5" r="5"/></svg>':'<svg width="10" height="10" viewBox="0 0 10 10" fill="#ef4444" style="vertical-align:-1px"><circle cx="5" cy="5" r="5"/></svg>'
    };
  } catch(e) { return null; }
}
function calcularCredito(s, maxSit) {
  if (maxSit != null && maxSit >= 4) return '$0 — Cuenta Corriente Rechazada';
  if(s>=900)return '$800.000 – $2.000.000';
  if(s>=700)return '$500.000 – $800.000';
  if(s>=500)return '$200.000 – $500.000';
  if(s>=400)return '$100.000 – $200.000';
  if(s>=300)return 'Hasta $100.000 (contado previo)';
  if(s>=200)return 'Solo contado anticipado';
  return 'No recomendado';
}
function scoreToColor(s){if(!s)return'var(--text2)';if(s>=700)return'var(--green)';if(s>=400)return'var(--yellow)';if(s>=200)return'var(--orange)';return'var(--red)';}
function scoreToRango(s){if(!s)return'—';if(s>=700)return'Excelente';if(s>=400)return'Bueno';if(s>=200)return'Revisar';if(s>=100)return'Alto riesgo';return'Rechazar';}
function sitBg(s){const b={1:'rgba(74,222,128,0.1)',2:'rgba(251,191,36,0.1)',3:'rgba(251,146,60,0.1)',4:'rgba(248,113,113,0.1)',5:'rgba(248,113,113,0.1)',6:'rgba(248,113,113,0.1)'};return b[s]||b[1];}
function fmtM(n){if(!n)return'0';if(n>=1e9)return'$'+(n/1e6).toFixed(0)+'MM';if(n>=1e6)return'$'+(n/1e6).toFixed(1)+'MM';if(n>=1e3)return'$'+(n/1e3).toFixed(0)+'K';return '$'+Math.round(n).toLocaleString('es-AR');}
function fmtFull(n){if(!n)return'0';return Math.round(n).toLocaleString('es-AR');}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

// Normalizar para búsqueda fuzzy
// matchBusqueda: filtra por nombre O por CUIT (d\u00edgitos) en tiempo real.
function matchBusqueda(nombre, query, cuit) {
  if (!query) return true;
  const q = query.trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  // Si la query es solo d\u00edgitos, buscar en CUIT
  if (/^\d+$/.test(q)) {
    const cn = (cuit || '').replace(/\D/g,'');
    return cn.includes(q);
  }
  // B\u00fasqueda por nombre (todas las palabras deben estar presentes)
  const n = nombre.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return q.split(' ').every(p => p.length < 2 || n.includes(p));
}
