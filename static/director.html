<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vende Seguro · Panel Dirección Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:        #0f1623;
    --bg2:       #161e2e;
    --bg3:       #1d2740;
    --card:      #1a2235;
    --card2:     #1f2a40;
    --border:    rgba(255,255,255,0.07);
    --border2:   rgba(255,255,255,0.12);
    --text:      #e2e8f0;
    --text2:     #94a3b8;
    --text3:     #64748b;
    --accent:    #3b82f6;
    --accent2:   #60a5fa;
    --green:     #10b981;
    --yellow:    #f59e0b;
    --orange:    #f97316;
    --red:       #ef4444;
    --red2:      #dc2626;
    --purple:    #8b5cf6;
    --radius:    12px;
    --shadow:    0 4px 24px rgba(0,0,0,0.4);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(135deg, #0c1526 0%, #162040 100%);
    border-bottom: 1px solid var(--border2);
    padding: 0 28px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,0.5);
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .header-logo {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.5px;
  }
  .header-logo span { color: var(--accent2); }
  .header-badge {
    background: rgba(59,130,246,0.15);
    border: 1px solid rgba(59,130,246,0.3);
    color: var(--accent2);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-date { font-size: 12px; color: var(--text3); }
  .btn-refresh {
    background: rgba(59,130,246,0.15);
    border: 1px solid rgba(59,130,246,0.3);
    color: var(--accent2);
    font-size: 12px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s;
  }
  .btn-refresh:hover { background: rgba(59,130,246,0.25); }
  .btn-back {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border2);
    color: var(--text2);
    font-size: 12px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s;
  }
  .btn-back:hover { background: rgba(255,255,255,0.08); color: var(--text); }

  /* ── MAIN ── */
  .main { max-width: 1400px; margin: 0 auto; padding: 28px 24px 60px; }

  /* ── KPI GRID ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .kpi-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.15s, transform 0.15s;
  }
  .kpi-card:hover { border-color: var(--border2); transform: translateY(-1px); }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--kpi-color, var(--accent));
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .kpi-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }
  .kpi-value {
    font-family: 'Syne', sans-serif;
    font-size: 26px;
    font-weight: 800;
    color: var(--text);
    line-height: 1;
    margin-bottom: 4px;
  }
  .kpi-sub { font-size: 11px; color: var(--text3); }
  .kpi-icon {
    position: absolute;
    top: 16px; right: 16px;
    opacity: 0.12;
    font-size: 32px;
  }

  /* ── AGING BAR ── */
  .aging-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 24px;
  }
  .aging-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 14px;
  }
  .aging-bar-wrap {
    height: 28px;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    margin-bottom: 10px;
  }
  .aging-seg {
    height: 100%;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
  }
  .aging-legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .aging-leg-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text2);
  }
  .aging-leg-dot {
    width: 10px; height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .aging-leg-pct { font-weight: 700; color: var(--text); margin-left: 2px; }

  /* ── CONTROLS ── */
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .search-box {
    flex: 1;
    min-width: 200px;
    max-width: 340px;
    background: var(--card);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 9px 14px 9px 38px;
    color: var(--text);
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    outline: none;
    position: relative;
  }
  .search-box::placeholder { color: var(--text3); }
  .search-box:focus { border-color: var(--accent); }
  .search-wrap { position: relative; }
  .search-icon {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    pointer-events: none;
  }
  .filter-select {
    background: var(--card);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 9px 14px;
    color: var(--text);
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    outline: none;
  }
  .filter-select option { background: var(--card2); }
  .sort-btn {
    background: var(--card);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 9px 14px;
    color: var(--text2);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .sort-btn.active { border-color: var(--accent); color: var(--accent2); }
  .results-count { font-size: 12px; color: var(--text3); margin-left: auto; }

  /* ── TABLE ── */
  .table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .table-head {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 2.5fr 60px;
    padding: 12px 20px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    font-weight: 700;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    gap: 8px;
    align-items: center;
  }
  .client-row {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .client-row:last-child { border-bottom: none; }
  .client-row-main {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 2.5fr 60px;
    padding: 14px 20px;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .client-row-main:hover { background: rgba(255,255,255,0.02); }
  .client-row.expanded .client-row-main { background: rgba(59,130,246,0.04); }

  .client-name {
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .client-cuit {
    font-family: 'Roboto Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    margin-top: 2px;
  }
  .client-vendedor { font-size: 11px; color: var(--text3); }

  /* Score badge */
  .score-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    font-family: 'Roboto Mono', monospace;
    border: 1px solid;
  }
  .score-rango { font-size: 10px; font-weight: 600; margin-top: 2px; }

  /* DSO badge */
  .dso-val {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 800;
    line-height: 1;
  }
  .dso-label { font-size: 10px; color: var(--text3); margin-top: 2px; }

  /* Saldo */
  .saldo-total {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: var(--text);
  }

  /* Aging mini-bar */
  .mini-aging {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .mini-bar-wrap {
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    background: rgba(255,255,255,0.04);
  }
  .mini-bar-seg { height: 100%; }
  .mini-aging-labels {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .mini-label {
    font-size: 10px;
    color: var(--text3);
  }
  .mini-label span { font-weight: 700; }

  /* Expand button */
  .expand-btn {
    width: 32px; height: 32px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border2);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text3);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, transform 0.2s;
    flex-shrink: 0;
  }
  .expand-btn:hover { background: rgba(59,130,246,0.15); color: var(--accent2); }
  .client-row.expanded .expand-btn { transform: rotate(180deg); color: var(--accent2); }

  /* ── INVOICE DETAIL ── */
  .invoice-detail {
    display: none;
    padding: 0 20px 16px;
    border-top: 1px solid var(--border);
    background: rgba(255,255,255,0.015);
  }
  .client-row.expanded .invoice-detail { display: block; }
  .invoice-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-top: 12px;
  }
  .invoice-table th {
    text-align: left;
    padding: 8px 12px;
    font-size: 10px;
    font-weight: 700;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.7px;
    background: rgba(255,255,255,0.02);
    border-bottom: 1px solid var(--border);
  }
  .invoice-table td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text2);
    vertical-align: middle;
  }
  .invoice-table tr:last-child td { border-bottom: none; }
  .invoice-table tr:hover td { background: rgba(255,255,255,0.02); }
  .invoice-nro {
    font-family: 'Roboto Mono', monospace;
    font-size: 11px;
    color: var(--text);
    font-weight: 600;
  }
  .dias-pill {
    display: inline-flex;
    align-items: center;
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    font-family: 'Roboto Mono', monospace;
    white-space: nowrap;
  }
  .saldo-cell {
    font-family: 'Roboto Mono', monospace;
    font-weight: 600;
    font-size: 12px;
  }

  /* ── SPINNER / LOADING ── */
  .loading-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    gap: 16px;
    color: var(--text3);
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(59,130,246,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── COLORS HELPERS ── */
  .c-green   { color: var(--green); }
  .c-yellow  { color: var(--yellow); }
  .c-orange  { color: var(--orange); }
  .c-red     { color: var(--red); }
  .c-accent  { color: var(--accent2); }

  /* ── EMPTY ── */
  .empty-row {
    padding: 48px 20px;
    text-align: center;
    color: var(--text3);
    font-size: 13px;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .table-head, .client-row-main {
      grid-template-columns: 1fr 1fr 60px;
    }
    .table-head > *:nth-child(2),
    .table-head > *:nth-child(3),
    .table-head > *:nth-child(4),
    .client-row-main > *:nth-child(2),
    .client-row-main > *:nth-child(3),
    .client-row-main > *:nth-child(4) { display: none; }
    .main { padding: 16px 12px 40px; }
    .header { padding: 0 16px; }
  }
</style>
</head>
<body>

<!-- ── HEADER ── -->
<header class="header">
  <div class="header-left">
    <div class="header-logo">Vende Seguro <span style="font-size:13px;font-weight:400;color:#64748b;margin-left:4px;">· Piattelli</span></div>
    <div class="header-badge">Panel Dirección Comercial</div>
  </div>
  <div class="header-right">
    <div id="header-dso-dir" style="text-align:right;opacity:0;transition:opacity 0.4s;margin-right:8px;" title="">
      <div style="font-size:9px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;">DSO Oficial</div>
      <div id="header-dso-dir-num" style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;line-height:1.1;">—</div>
      <div id="header-dso-dir-sub" style="font-size:9px;color:#94a3b8;">días</div>
    </div>
    <span class="header-date" id="header-fecha">—</span>
    <button class="btn-refresh" onclick="cargarDatos()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
      Actualizar
    </button>
    <a href="/director-logout" class="btn-back" title="Cerrar sesión">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Salir
    </a>
  </div>
</header>

<main class="main" id="main-content">
  <div class="loading-wrap">
    <div class="spinner"></div>
    <div>Cargando datos...</div>
  </div>
</main>

<script>
// Aging: días desde fecha de factura hasta hoy
// 0-30 → d30 | 31-60 → d60 | 61-90 → d90 | 91-120 → d120 | 120+ → d120plus
const BUCKETS = ['d30','d60','d90','d120','d120plus'];
const BUCKET_LABELS = {
  d30:      '0–30 d',
  d60:      '31–60 d',
  d90:      '61–90 d',
  d120:     '91–120 d',
  d120plus: '+120 d',
};
const BUCKET_COLORS = {
  d30:      '#10b981',  // verde   — 0-30 días (reciente)
  d60:      '#f59e0b',  // amarillo — 31-60 días
  d90:      '#f97316',  // naranja  — 61-90 días
  d120:     '#ef4444',  // rojo     — 91-120 días
  d120plus: '#7f1d1d',  // rojo oscuro — +120 días (crítico)
};

var _data = null;
var _sortKey = 'saldo_total';
var _sortDir = -1;
var _filterVend = '';
var _search = '';
var _filterBucket = ''; // '' | 'd30' | 'd60' | 'd90' | 'd120plus'

function fmt(n) {
  if (!n && n !== 0) return '—';
  return Math.round(n).toLocaleString('es-AR');
}
function fmtFull(n) {
  if (!n && n !== 0) return '0';
  return Math.round(n).toLocaleString('es-AR');
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function colorScore(s) {
  if (!s) return '#6b7280';
  if (s >= 700) return '#10b981';
  if (s >= 400) return '#f59e0b';
  if (s >= 200) return '#f97316';
  return '#ef4444';
}
function colorDSO(d) {
  if (d <= 15) return '#10b981';
  if (d <= 30) return '#3b82f6';
  if (d <= 60) return '#f59e0b';
  if (d <= 90) return '#f97316';
  return '#ef4444';
}
function colorDias(d) {
  if (d === 0) return {bg:'rgba(16,185,129,0.15)', color:'#10b981'};
  if (d <= 30)  return {bg:'rgba(59,130,246,0.15)', color:'#60a5fa'};
  if (d <= 60)  return {bg:'rgba(245,158,11,0.15)', color:'#f59e0b'};
  if (d <= 90)  return {bg:'rgba(249,115,22,0.15)', color:'#f97316'};
  return {bg:'rgba(239,68,68,0.15)', color:'#ef4444'};
}

var _dsoPorCliente = {};   // cache para el render de filas

async function cargarDSODir() {
  try {
    // Cargar global + por vendedor + por cliente en paralelo
    const [rGlobal, rTodos] = await Promise.all([
      fetch('/dso-global-saldos'),
      fetch('/api/dso-todos')
    ]);
    const d     = await rGlobal.json();
    const todos = await rTodos.json();

    // Guardar DSO por cliente para usarlo en las filas de la tabla
    _dsoPorCliente = todos.por_cliente || {};

    if (!d || d.dso == null) return;
    const color = colorDSO(d.dso);
    const numEl = document.getElementById('header-dso-dir-num');
    const subEl = document.getElementById('header-dso-dir-sub');
    const wrap  = document.getElementById('header-dso-dir');
    if (!numEl || !wrap) return;
    numEl.textContent = d.dso + 'd';
    numEl.style.color = color;
    subEl.textContent = 'al ' + (d.fecha_corte || '—');
    wrap.style.opacity = '1';
    wrap.title = 'Método de agotamiento 3m';
    // Actualizar el kpi-card "DSO Promedio" con el valor global
    var kpiGrid = document.getElementById('kpi-grid');
    if (kpiGrid) {
      var cards = kpiGrid.querySelectorAll('.kpi-card');
      cards.forEach(function(card) {
        if (card.querySelector('.kpi-label') && card.querySelector('.kpi-label').textContent.includes('DSO')) {
          card.querySelector('.kpi-value').textContent = d.dso + 'd';
          card.querySelector('.kpi-value').style.color = color;
          card.style.setProperty('--kpi-color', color);
          var sub = card.querySelector('.kpi-sub');
          if (sub) sub.textContent = 'fórmula estándar 4m';
        }
      });
    }
  } catch(e) {}
}

async function cargarDatos() {
  document.getElementById('main-content').innerHTML =
    '<div class="loading-wrap"><div class="spinner"></div><div>Cargando datos...</div></div>';
  try {
    const r = await fetch('/api/director-data');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    _data = await r.json();
    document.getElementById('header-fecha').textContent = 'Al día: ' + _data.fecha_hoy;
    renderApp();
    cargarDSODir();
  } catch(e) {
    document.getElementById('main-content').innerHTML =
      '<div class="loading-wrap"><div style="color:#ef4444;font-weight:600;">Error al cargar datos: ' + e.message + '</div></div>';
  }
}

// Calcular totales a partir de la lista filtrada
function calcTotales(lista) {
  var ts = 0, tb = {d30:0,d60:0,d90:0,d120:0,d120plus:0};
  var n_vencido = 0, n_critico = 0, n_riesgo = 0;
  var suma_pond = 0;
  lista.forEach(function(c) {
    ts += c.saldo_total;
    BUCKETS.forEach(function(bk){ tb[bk] += (c.buckets[bk]||0); });
    if ((c.buckets.d60||0)+(c.buckets.d90||0)+(c.buckets.d120||0)+(c.buckets.d120plus||0) > 0) n_vencido++;
    if ((c.buckets.d90||0)+(c.buckets.d120||0)+(c.buckets.d120plus||0) > 0) n_critico++;
    if (c.score && c.score < 400) n_riesgo++;
    c.facturas.forEach(function(f){ suma_pond += f.saldo * (f.dias||0); });
  });
  return {
    total_saldo: ts, total_buckets: tb,
    dso_global: ts > 0 ? Math.round(suma_pond/ts) : 0,
    n_clientes: lista.length, n_vencido: n_vencido,
    n_critico: n_critico, n_riesgo: n_riesgo
  };
}

function renderKPIsAndAging(stats) {
  var total = stats.total_saldo || 1;
  var tb = stats.total_buckets || {};
  var d30_60 = (tb.d60||0);
  var d60_90 = (tb.d90||0);
  var critico = (tb.d120||0)+(tb.d120plus||0);

  // KPI cards — con data-bucket para filtrado interactivo
  // bucket vacío ('') = sin filtro (muestra todos)
  var kpis = [
    { label:'Saldo Total',   value: fmt(stats.total_saldo), sub: fmtFull(stats.total_saldo),         color:'#3b82f6', icon:'💰', bucket:'' },
    { label:'0–30 días',     value: fmt(tb.d30||0),  sub: pct(tb.d30,total)+'% del total',           color:'#10b981', icon:'✅', bucket:'d30' },
    { label:'31–60 días',    value: fmt(d30_60),      sub: pct(d30_60,total)+'% del total',           color:'#f59e0b', icon:'📅', bucket:'d60' },
    { label:'61–90 días',    value: fmt(d60_90),      sub: pct(d60_90,total)+'% del total',           color:'#f97316', icon:'⚠️', bucket:'d90' },
    { label:'Crítico +90 d', value: fmt(critico),     sub: pct(critico,total)+'% del total',          color:'#ef4444', icon:'🚨', bucket:'d120plus' },
    { label:'DSO Promedio',  value: stats.dso_global+'d', sub:'días ponderado por saldo',            color: colorDSO(stats.dso_global), icon:'📊', bucket:'' },
    { label:'Clientes',      value: stats.n_clientes, sub: stats.n_vencido+' con vencimiento >30d',  color:'#8b5cf6', icon:'👥', bucket:'' },
    { label:'Críticos +90d', value: stats.n_critico,  sub: stats.n_riesgo+' con score < 400',        color:'#f97316', icon:'⚡', bucket:'d120plus' },
  ];

  var kpiHtml = '<div class="kpi-grid" id="kpi-grid">';
  kpis.forEach(function(k) {
    var isActive   = k.bucket && k.bucket === _filterBucket;
    var isClickable = true; // todos son clickeables (los sin bucket resetean)
    var activeStyle = isActive
      ? 'outline:2px solid '+k.color+';outline-offset:2px;background:rgba('+hexToRgb(k.color)+',0.08);'
      : '';
    var cursorStyle = 'cursor:pointer;';
    kpiHtml += '<div class="kpi-card" style="--kpi-color:'+k.color+';'+activeStyle+cursorStyle+'"'
      +' onclick="setFilterBucket(\''+k.bucket+'\')" title="'+(k.bucket ? 'Filtrar por '+k.label : 'Ver todos')+'">'
      +'<div class="kpi-label">'+esc(k.label)+(isActive ? ' <span style="font-size:9px;color:'+k.color+'">● activo</span>' : '')+'</div>'
      +'<div class="kpi-value" style="color:'+k.color+'">'+k.value+'</div>'
      +'<div class="kpi-sub">'+k.sub+'</div>'
      +'<div class="kpi-icon">'+k.icon+'</div>'
      +'</div>';
  });
  kpiHtml += '</div>';

  // Aging bar
  var agingHtml = '<div class="aging-section" id="aging-section">'
    +'<div class="aging-title">Distribución de Aging — Antigüedad desde fecha de factura</div>'
    +'<div class="aging-bar-wrap">';
  BUCKETS.forEach(function(bk) {
    var v = tb[bk]||0, w = total > 0 ? (v/total*100).toFixed(1) : 0;
    if (w > 0) agingHtml += '<div class="aging-seg" style="width:'+w+'%;background:'+BUCKET_COLORS[bk]+'"></div>';
  });
  agingHtml += '</div><div class="aging-legend">';
  BUCKETS.forEach(function(bk) {
    var v = tb[bk]||0;
    agingHtml += '<div class="aging-leg-item">'
      +'<div class="aging-leg-dot" style="background:'+BUCKET_COLORS[bk]+'"></div>'
      +BUCKET_LABELS[bk]+': '+fmt(v)
      +' <span class="aging-leg-pct">'+pct(v,total)+'%</span>'
      +'</div>';
  });
  agingHtml += '</div></div>';
  return kpiHtml + agingHtml;
}

function renderApp() {
  if (!_data) return;
  const d = _data;

  // Calcular totales globales iniciales
  var stats = calcTotales(_data.clientes || []);

  // Controls
  var vendedores = [...new Set((_data.clientes||[]).map(function(c){return c.vendedor;}).filter(Boolean))].sort();
  var controlsHtml = '<div class="controls">'
    + '<div class="search-wrap">'
    + '<svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>'
    + '<input class="search-box" id="search-input" placeholder="Buscar cliente o CUIT..." oninput="onSearch(this.value)" value="' + esc(_search) + '">'
    + '</div>'
    + '<select class="filter-select" id="vend-filter" onchange="onFilterVend(this.value)">'
    + '<option value="">Todos los vendedores</option>'
    + vendedores.map(v => '<option value="' + esc(v) + '"' + (v===_filterVend?' selected':'') + '>' + esc(v) + '</option>').join('')
    + '</select>'
    + '<button class="sort-btn' + (_sortKey==='saldo_total'?' active':'') + '" onclick="setSort(\'saldo_total\')">Saldo ↕</button>'
    + '<button class="sort-btn' + (_sortKey==='dso'?' active':'') + '" onclick="setSort(\'dso\')">DSO ↕</button>'
    + '<button class="sort-btn' + (_sortKey==='score'?' active':'') + '" onclick="setSort(\'score\')">Score ↕</button>'
    + '<span class="results-count" id="results-count"></span>'
    + '</div>';

  // Table
  let tableHtml = '<div class="table-wrap">'
    + '<div class="table-head">'
    + '<div>Cliente</div>'
    + '<div>Score</div>'
    + '<div>DSO</div>'
    + '<div>Saldo Total</div>'
    + '<div>Aging</div>'
    + '<div></div>'
    + '</div>'
    + '<div id="clientes-body"></div>'
    + '</div>';

  var statsInitial = calcTotales(_data.clientes||[]);
  document.getElementById('main-content').innerHTML =
    renderKPIsAndAging(statsInitial) + controlsHtml + tableHtml;
  renderTabla();
}

function renderTabla() {
  if (!_data) return;
  var lista = (_data.clientes || []).slice();

  // Filtros
  if (_filterVend) lista = lista.filter(function(c){ return c.vendedor === _filterVend; });
  if (_search) {
    var q = _search.toLowerCase();
    lista = lista.filter(function(c) {
      return (c.nombre||'').toLowerCase().includes(q) ||
             (c.cuit||'').includes(q) ||
             (c.vendedor||'').toLowerCase().includes(q);
    });
  }
  // Filtro por bucket de aging (click en KPI)
  if (_filterBucket) {
    lista = lista.filter(function(c) {
      if (_filterBucket === 'd120plus') {
        // "Crítico +90d" incluye d90, d120 y d120plus
        return (c.buckets.d90||0) + (c.buckets.d120||0) + (c.buckets.d120plus||0) > 0;
      }
      return (c.buckets[_filterBucket]||0) > 0;
    });
  }

  // Actualizar KPIs y aging según los datos filtrados
  var statsFiltered = calcTotales(lista);
  var kpiEl   = document.getElementById('kpi-grid');
  var agingEl = document.getElementById('aging-section');
  if (kpiEl && agingEl) {
    var newHtml = renderKPIsAndAging(statsFiltered);
    var tmp = document.createElement('div');
    tmp.innerHTML = newHtml;
    kpiEl.replaceWith(tmp.querySelector('#kpi-grid'));
    agingEl.replaceWith(tmp.querySelector('#aging-section'));
  }

  // Ordenar
  lista.sort(function(a,b) {
    var va = a[_sortKey], vb = b[_sortKey];
    if (va == null) va = _sortDir > 0 ? -Infinity : Infinity;
    if (vb == null) vb = _sortDir > 0 ? -Infinity : Infinity;
    return (va - vb) * _sortDir;
  });

  var el = document.getElementById('results-count');
  if (el) el.textContent = lista.length + ' clientes';

  var body = document.getElementById('clientes-body');
  if (!body) return;

  if (!lista.length) {
    body.innerHTML = '<div class="empty-row">No se encontraron clientes con los filtros aplicados.</div>';
    return;
  }

  body.innerHTML = lista.map(function(c, idx) {
    return renderClientRow(c, idx);
  }).join('');
}

function normNombreDir(s) {
  return String(s || '').trim().toUpperCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
}

function renderClientRow(c, idx) {
  var sc = c.score;
  var scColor = colorScore(sc);
  // DSO individual: buscar en cache por agotamiento con múltiples variantes de nombre
  var _nNorm = normNombreDir(c.nombre);
  var dsoExh = _dsoPorCliente[_nNorm];
  // Fallback: buscar coincidencia parcial (primeras 2 palabras) por si el nombre difiere levemente
  if (dsoExh == null && _nNorm) {
    var _prim = _nNorm.split(' ').slice(0, 2).join(' ');
    var _found = Object.keys(_dsoPorCliente).find(function(k) { return k.startsWith(_prim); });
    if (_found) dsoExh = _dsoPorCliente[_found];
  }
  var dsoVal = (dsoExh != null) ? dsoExh : (c.dso || 0);
  var dsoColor = colorDSO(dsoVal);
  var total = c.saldo_total || 1;
  var tb = c.buckets || {};

  // Score badge
  var scoreBadge = sc != null
    ? '<div class="score-badge" style="color:' + scColor + ';border-color:' + scColor + '33;background:' + scColor + '15">'
        + sc
        + '</div>'
        + '<div class="score-rango" style="color:' + scColor + '">' + esc(c.rango||'') + '</div>'
    : '<div style="font-size:11px;color:#64748b;">Sin score</div>';

  // DSO cell
  var dsoBadge = '<div class="dso-val" style="color:' + dsoColor + '">' + dsoVal + '</div>'
    + '<div class="dso-label">días</div>';

  // Mini aging bar
  var miniBar = '<div class="mini-aging">'
    + '<div class="mini-bar-wrap">';
  BUCKETS.forEach(function(bk) {
    var v = tb[bk] || 0;
    var w = total > 0 ? (v/total*100).toFixed(1) : 0;
    if (w > 0) miniBar += '<div class="mini-bar-seg" style="width:' + w + '%;background:' + BUCKET_COLORS[bk] + '"></div>';
  });
  miniBar += '</div><div class="mini-aging-labels">';

  BUCKETS.forEach(function(bk) {
    var v = tb[bk] || 0;
    if (v > 0) {
      miniBar += '<div class="mini-label" style="color:' + BUCKET_COLORS[bk] + '">'
        + BUCKET_LABELS[bk] + ': <span>' + fmt(v) + '</span></div>';
    }
  });
  miniBar += '</div></div>';

  // Invoice detail
  var facturas = c.facturas || [];
  var invoiceRows = facturas.map(function(f) {
    var cd = colorDias(f.dias||0);
    var diasLabel = (f.dias||0) === 0 ? '0 días' : (f.dias||0) + ' días';
    return '<tr>'
      + '<td><div class="invoice-nro">' + esc(f.nro || '—') + '</div></td>'
      + '<td>' + esc(f.fecha_factura||'—') + '</td>'
      + '<td>' + esc(f.fecha_pago||'—') + '</td>'
      + '<td style="text-align:right;font-family:\'Roboto Mono\',monospace;font-size:12px;color:#e2e8f0">' + fmtFull(f.total) + '</td>'
      + '<td style="text-align:right"><span class="saldo-cell" style="color:#f97316">' + fmtFull(f.saldo) + '</span></td>'
      + '<td style="text-align:center"><span class="dias-pill" style="background:' + cd.bg + ';color:' + cd.color + '">' + diasLabel + '</span></td>'
      + '</tr>';
  }).join('');

  var invoiceTotal = facturas.reduce(function(s,f){return s+f.saldo;},0);

  var invoiceDetail = '<div class="invoice-detail">'
    + '<table class="invoice-table">'
    + '<thead><tr>'
    + '<th>N° Factura</th><th>Fecha Emisión</th><th>Vence</th>'
    + '<th style="text-align:right">Total</th><th style="text-align:right">Saldo</th>'
    + '<th style="text-align:center">Estado</th>'
    + '</tr></thead>'
    + '<tbody>' + invoiceRows + '</tbody>'
    + '<tfoot><tr style="background:rgba(255,255,255,0.03)">'
    + '<td colspan="4" style="padding:9px 12px;font-weight:700;font-size:11px;color:#94a3b8;">TOTAL PENDIENTE</td>'
    + '<td style="padding:9px 12px;text-align:right;font-weight:800;font-family:\'Roboto Mono\',monospace;color:#f97316">' + fmtFull(invoiceTotal) + '</td>'
    + '<td></td>'
    + '</tr></tfoot>'
    + '</table></div>';

  var cuitFmt = c.cuit && c.cuit.length === 11
    ? c.cuit.slice(0,2)+'-'+c.cuit.slice(2,10)+'-'+c.cuit.slice(10)
    : (c.cuit||'');

  return '<div class="client-row" id="row-' + idx + '">'
    + '<div class="client-row-main" onclick="toggleRow(' + idx + ')">'
    + '<div>'
      + '<div class="client-name">' + esc(c.nombre||'—') + '</div>'
      + '<div class="client-cuit">' + cuitFmt + ' · <span class="client-vendedor">' + esc(c.vendedor||'—') + '</span></div>'
    + '</div>'
    + '<div>' + scoreBadge + '</div>'
    + '<div>' + dsoBadge + '</div>'
    + '<div><div class="saldo-total">' + fmt(c.saldo_total) + '</div></div>'
    + '<div>' + miniBar + '</div>'
    + '<div><button class="expand-btn">'
      + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>'
    + '</button></div>'
    + '</div>'
    + invoiceDetail
    + '</div>';
}

function toggleRow(idx) {
  var row = document.getElementById('row-' + idx);
  if (row) row.classList.toggle('expanded');
}

function onSearch(v) { _search = v; renderTabla(); }
function onFilterVend(v) { _filterVend = v; renderTabla(); }
function setSort(key) {
  if (_sortKey === key) { _sortDir *= -1; } else { _sortKey = key; _sortDir = -1; }
  renderTabla();
  document.querySelectorAll('.sort-btn').forEach(function(b){ b.classList.remove('active'); });
  if (event && event.target) event.target.classList.add('active');
}
function setFilterBucket(bucket) {
  // Toggle: click en el activo lo desactiva; click en otro lo activa
  _filterBucket = (_filterBucket === bucket) ? '' : bucket;
  renderTabla(); // renderTabla actualiza KPIs y tabla
}
function hexToRgb(hex) {
  // '#10b981' → '16,185,129' para usar en rgba()
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return r+','+g+','+b;
}
function pct(v, total) {
  if (!total || !v) return '0';
  return (v/total*100).toFixed(1).replace('.0','');
}

// Init
cargarDatos();
</script>
