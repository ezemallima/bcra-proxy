services:
  - type: web
    name: bcra-proxy
    runtime: python
    buildCommand: pip install -r requisitos.txt
    startCommand: gunicorn main:app --workers 1 --threads 4 --timeout 120 --keep-alive 5 --max-requests 500 --max-requests-jitter 50
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
